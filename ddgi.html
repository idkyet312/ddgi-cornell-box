<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DDGI Test Scenes — WebGL & WebGPU</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #scene-picker {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: rgba(0,0,0,0.6); padding: 4px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 2px;
  }
  #scene-picker button {
    background: transparent; color: #ccc; border: 0; padding: 8px 16px;
    font-family: inherit; font-size: 12px; cursor: pointer; border-radius: 6px;
    transition: background 0.15s, color 0.15s;
  }
  #scene-picker button:hover { background: rgba(255,255,255,0.06); color: #fff; }
  #scene-picker button.active { background: #fff; color: #000; }
  #scene-picker button:disabled { color: #666; cursor: not-allowed; }
  #scene-picker button:disabled:hover { background: transparent; }
  #info {
    position: absolute; top: 56px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 6px;
    font-size: 12px; line-height: 1.5; max-width: 340px; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.08);
  }
  #info b { color: #fff; font-size: 13px; }
  #info span.tag { display: inline-block; background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px; vertical-align: 1px; }
  #info span.tag.fix { background: rgba(120,200,90,0.18); color: #aaffa0; }
  #stats { position: absolute; top: 56px; right: 12px; z-index: 10; background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 6px; font-size: 11px; font-family: monospace; border: 1px solid rgba(255,255,255,0.08); }
  #status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30;
    background: rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.12);
    padding: 18px 26px; border-radius: 10px; font-size: 13px; max-width: 600px; min-width: 320px; text-align: center;
    display: none;
  }
  #status details { color: #ccc; }
  #status details summary { color: #999; }
  #status details > div { color: #aaa; }
  #status.show { display: block; }
  #status .err { color: #ff8a80; }
  canvas { display: block; }
  #canvas-container { position: absolute; inset: 0; }
</style>
</head>
<body>

<div id="scene-picker">
  <button data-scene="webgl" class="active">WebGL · basic</button>
  <button data-scene="webgpu">WebGPU · depth-aware</button>
  <button data-scene="webgpu-simple">WebGPU · simple test</button>
  <button data-scene="webgpu-rt">WebGPU · raytraced</button>
</div>

<div id="info">
  <b>DDGI Test Scenes</b>
  <span class="tag" id="tag-mode">three.js · WebGL</span>
  <div id="info-body" style="margin-top:6px; opacity:0.85;"></div>
  <div style="margin-top:6px; opacity:0.7;">Drag to orbit · scroll to zoom</div>
</div>

<div id="stats">probes updated: <span id="updateCount">0</span><br/>fps: <span id="fps">—</span></div>

<div id="status"></div>

<div id="canvas-container"></div>

<script>
(function () {
  function showBootError(title, detail, source) {
    var el = document.getElementById('status');
    if (!el) return;

    el.classList.add('show');
    el.textContent = '';

    var wrap = document.createElement('span');
    wrap.className = 'err';

    var heading = document.createElement('b');
    heading.textContent = title;
    wrap.appendChild(heading);

    if (detail) {
      wrap.appendChild(document.createElement('br'));
      wrap.appendChild(document.createTextNode(detail));
    }

    if (source) {
      wrap.appendChild(document.createElement('br'));
      var small = document.createElement('small');
      small.textContent = source;
      wrap.appendChild(small);
    }

    el.appendChild(wrap);
  }

  window.__showBootError = showBootError;

  window.addEventListener('error', function (e) {
    var message = e.message || (e.error && e.error.message) || 'unknown';
    showBootError(
      'JS error',
      message,
      (e.filename || '') + (e.lineno ? ':' + e.lineno : '')
    );
    console.error('[caught]', e);
  });

  window.addEventListener('unhandledrejection', function (e) {
    var message = (e.reason && e.reason.message) || e.reason || 'unknown';
    showBootError('Unhandled promise rejection', message);
    console.error('[unhandledrejection]', e);
  });

  var supportsModule = 'noModule' in HTMLScriptElement.prototype;
  var supportsImportMap = !HTMLScriptElement.supports || HTMLScriptElement.supports('importmap');

  if (!supportsModule) {
    showBootError('Browser too old', 'This demo needs JavaScript modules. Try a current Chrome, Edge, Firefox, or Safari build.');
  } else if (!supportsImportMap) {
    showBootError('Import maps not supported', 'This browser cannot resolve the Three.js module imports used by the demo. Try a current Chrome, Edge, Firefox, or Safari build.');
  }
})();
</script>

<script type="importmap">
{
  "imports": {
    "three":            "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/webgpu":     "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.webgpu.js",
    "three/tsl":        "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.tsl.js",
    "three/addons/":    "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/",
    "three-mesh-bvh":   "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/+esm"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/+esm';

// WebGPU-only imports — loaded lazily so a browser without WebGPU can still run the WebGL scene.
let WebGPUImports = null;
async function loadWebGPUImports() {
  if (WebGPUImports) return WebGPUImports;
  const [gpu, tsl] = await Promise.all([
    import('three/webgpu'),
    import('three/tsl'),
  ]);
  WebGPUImports = { ...gpu, TSL: tsl };
  return WebGPUImports;
}

// ---------- shared constants ----------
const BOX = { x: 1.0, y: 1.0, z: 1.0 };
const PROBE_DIMS = new THREE.Vector3(7, 7, 7);
// Floor-side bottom slice lifted from 0.15 → 0.30: the lower probes were
// spending ~30% of their hemisphere on self-floor hits, washing the SH band-0
// to white from the panel reflection on the floor and crushing the colored
// wall contribution. At 0.30 the floor probes have more clear-line-of-sight
// to the side walls, so red/green bleed survives in the SH bands.
const PROBE_MIN  = new THREE.Vector3(-BOX.x * 0.85, 0.30,            -BOX.z * 0.85);
const PROBE_MAX  = new THREE.Vector3( BOX.x * 0.85, 2*BOX.y - 0.15,   BOX.z * 0.85);
const PROBE_COUNT = PROBE_DIMS.x * PROBE_DIMS.y * PROBE_DIMS.z;

// ---------- scene host ----------
const container = document.getElementById('canvas-container');
const statusEl  = document.getElementById('status');
const tagEl     = document.getElementById('tag-mode');
const infoBody  = document.getElementById('info-body');
const updateCountEl = document.getElementById('updateCount');
const fpsEl     = document.getElementById('fps');

let currentSceneInstance = null;
let currentSceneKey = null;

const sceneInfos = {
  webgl: {
    tag: 'three.js · WebGL',
    body: 'A 3×3×3 grid of irradiance probes captures the scene via cubemap renders, converts to L2 spherical harmonics, and is blended trilinearly per fragment to add indirect light.'
  },
  webgpu: {
    tag: 'three.js · WebGPU · GI (uniformArray)',
    body: 'WebGPU + NodeMaterials + DDGI. SH coefficients exposed via TSL uniformArray (skipping the failing DataTexture upload path). 3×3×3 probe grid, manual SH integration on CPU, trilinear blend per fragment via TSL Fn. Diagnostic dropdown still available — switch to mode 4 to verify probe[0] data is reaching the shader.'
  },
  'webgpu-simple': {
    tag: 'three.js · WebGPU · GI test room',
    body: 'A simpler DDGI room for debugging bounce light: the same 3×3×3 WebGPU probe grid, but with one centered white box instead of the full Cornell-box clutter. Easier to read probe leakage, wall tint, and rebake behavior.'
  },
  'webgpu-rt': {
    tag: 'three.js · WebGPU · raytraced DDGI',
    body: 'Probe capture replaced with a WGSL compute shader that traces 64 rays per probe against a three-mesh-bvh BVH. SH coefficients + depth moments are integrated on the GPU. The room is intentionally simplified to one centered box so probe trapping, leakage, and bounce tint are easier to read while keeping the same raytraced DDGI path.'
  }
};

function setStatus(html, isError = false) {
  if (!html) { statusEl.classList.remove('show'); return; }
  statusEl.innerHTML = isError ? `<span class="err">${html}</span>` : html;
  statusEl.classList.add('show');
}

// breadcrumb stack — visible to user during loadScene
const breadcrumbs = [];
function bc(msg) {
  breadcrumbs.push(msg);
  console.log('[bc]', msg);
  // throttle DOM update — only show last 8
  const list = breadcrumbs.slice(-8).map(m => `<div>· ${m}</div>`).join('');
  if (statusEl.classList.contains('show')) {
    const head = statusEl.querySelector('[data-head]');
    if (head) statusEl.querySelector('[data-bc]').innerHTML = list;
  }
}

function setSceneInfo(key) {
  tagEl.textContent = sceneInfos[key].tag;
  infoBody.textContent = sceneInfos[key].body;
}

async function loadScene(key) {
  if (currentSceneKey === key) return;
  breadcrumbs.length = 0;
  // tear down
  if (currentSceneInstance) {
    try { await currentSceneInstance.dispose(); } catch (e) { console.warn(e); }
    currentSceneInstance = null;
  }
  // remove old canvas + GUIs
  container.innerHTML = '';
  document.querySelectorAll('.lil-gui').forEach(el => el.remove());

  // mark active button
  document.querySelectorAll('#scene-picker button').forEach(b => {
    b.classList.toggle('active', b.dataset.scene === key);
  });

  // initialize status with breadcrumb area
  statusEl.innerHTML = `<div data-head><b>Loading ${key}…</b></div><div data-bc style="margin-top:8px; font-size:11px; opacity:0.75; text-align:left; font-family:monospace;"></div>`;
  statusEl.classList.add('show');
  setSceneInfo(key);

  const canvas = document.createElement('canvas');
  container.appendChild(canvas);

  bc(`loadScene(${key}) started`);

  try {
    if (key === 'webgl') {
      currentSceneInstance = await createWebGLScene(canvas);
    } else if (key === 'webgpu') {
      currentSceneInstance = await createWebGPUScene(canvas);
    } else if (key === 'webgpu-simple') {
      currentSceneInstance = await createWebGPUScene(canvas, { preset: 'simple' });
    } else if (key === 'webgpu-rt') {
      currentSceneInstance = await createWebGPURTScene(canvas);
    }
    currentSceneKey = key;
    setStatus('');
  } catch (err) {
    console.error(err);
    const stack = (err && err.stack) ? String(err.stack).split('\n').slice(0, 6).join('<br/>') : '';
    statusEl.innerHTML = `<span class="err">
      <b>Failed to load ${key} scene</b><br/>
      <span style="font-family:monospace; font-size:11px;">${err.message || err}</span>
      <details style="margin-top:8px; text-align:left;"><summary style="cursor:pointer; font-size:11px;">stack + breadcrumbs</summary>
        <div style="font-family:monospace; font-size:10px; margin-top:6px; opacity:0.85;">${stack}</div>
        <div style="font-family:monospace; font-size:10px; margin-top:6px; opacity:0.65;">${breadcrumbs.map(m => '· ' + m).join('<br/>')}</div>
      </details>
    </span>`;
    statusEl.classList.add('show');
    // restore old button highlight
    document.querySelectorAll('#scene-picker button').forEach(b => {
      b.classList.toggle('active', b.dataset.scene === currentSceneKey);
    });
  }
}

document.querySelectorAll('#scene-picker button').forEach(b => {
  b.addEventListener('click', () => loadScene(b.dataset.scene));
});

// detect WebGPU support
if (!('gpu' in navigator)) {
  document.querySelectorAll('button[data-scene^="webgpu"]').forEach(btn => {
    btn.disabled = true;
    btn.title = 'WebGPU not available in this browser';
  });
}

// ---------- helper: shared FPS / probe-count tracking ----------
class Stats {
  constructor() { this.fpsAccum = 0; this.fpsTimer = 0; this.totalProbeUpdates = 0; }
  tick(dt) {
    this.fpsAccum++;
    this.fpsTimer += dt;
    if (this.fpsTimer >= 0.5) {
      fpsEl.textContent = Math.round(this.fpsAccum / this.fpsTimer);
      updateCountEl.textContent = this.totalProbeUpdates.toLocaleString();
      this.fpsAccum = 0; this.fpsTimer = 0;
    }
  }
}

// ============================================================
// WebGPU scene — minimal rebuild. Phase 2 of incremental rebuild.
// Just renderer + Cornell box + direct lighting. No probes, no GI yet.
// We add features in subsequent phases once this is verified working.
// ============================================================
async function createWebGPUScene(canvas, options = {}) {
  if (!navigator.gpu) throw new Error('WebGPU not available in this browser.');

  const scenePreset = options.preset === 'simple' ? 'simple' : 'cornell';
  const simpleScene = scenePreset === 'simple';

  bc('createWebGPUScene start');

  // Lazy-load WebGPU/TSL bundles
  bc('loading three/webgpu + three/tsl…');
  const { WebGPURenderer, MeshStandardNodeMaterial, MeshBasicNodeMaterial, IrradianceNode, TSL } = await loadWebGPUImports();
  bc('imports loaded');

  bc('constructing WebGPURenderer');
  const renderer = new WebGPURenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  bc('awaiting renderer.init()');
  await renderer.init();
  bc('renderer init done');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  class DDGIMeshStandardNodeMaterial extends MeshStandardNodeMaterial {
    constructor(parameters) {
      super(parameters);
      this.ddgiIrradianceNode = null;
    }

    setupLightMap(builder) {
      if (this.ddgiIrradianceNode) {
        return new IrradianceNode(this.ddgiIrradianceNode);
      }

      return super.setupLightMap(builder);
    }

    copy(source) {
      super.copy(source);
      this.ddgiIrradianceNode = source.ddgiIrradianceNode;
      return this;
    }
  }

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 100);
  camera.position.set(0, 1.0, 3.6);

  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 1.0, 0);
  controls.enableDamping = true;
  controls.minDistance = 1.2;
  controls.maxDistance = 8;

  if (simpleScene) {
    camera.position.set(0, 0.95, 3.0);
    controls.target.set(0, 0.65, 0.05);
  }

  bc(simpleScene ? 'building simple DDGI test room' : 'building Cornell box');

  const cornell = new THREE.Group();
  scene.add(cornell);

  const wallMat = (color) =>
    new DDGIMeshStandardNodeMaterial({ color, roughness: 1.0, metalness: 0.0 });
  const matWhite = wallMat(0xeeeeee);
  const matRed   = wallMat(0xcc2828);
  const matGreen = wallMat(0x28a828);

  const WALL_SEGMENTS = simpleScene ? 1 : 96;
  const BOX_SEGMENTS = 1;
  const makeQuad = (w,h,m) => new THREE.Mesh(new THREE.PlaneGeometry(w, h, WALL_SEGMENTS, WALL_SEGMENTS), m);
  const boxWireframes = [];
  const addBoxWireframe = (mesh) => {
    const wireMat = new THREE.LineBasicMaterial({
      color: 0x111111,
      transparent: true,
      opacity: 0.42,
    });
    wireMat.depthWrite = false;
    const wire = new THREE.LineSegments(new THREE.WireframeGeometry(mesh.geometry), wireMat);
    wire.scale.setScalar(1.003);
    wire.visible = false;
    wire.renderOrder = 2;
    boxWireframes.push(wire);
    mesh.add(wire);
  };
  { const m = makeQuad(2*BOX.x, 2*BOX.z, matWhite); m.rotation.x = -Math.PI/2; cornell.add(m); }
  { const m = makeQuad(2*BOX.x, 2*BOX.z, matWhite); m.rotation.x =  Math.PI/2; m.position.y = 2*BOX.y; cornell.add(m); }
  { const m = makeQuad(2*BOX.x, 2*BOX.y, matWhite); m.position.set(0, BOX.y, -BOX.z); cornell.add(m); }
  { const m = makeQuad(2*BOX.z, 2*BOX.y, matRed);   m.rotation.y =  Math.PI/2; m.position.set(-BOX.x, BOX.y, 0); cornell.add(m); }
  { const m = makeQuad(2*BOX.z, 2*BOX.y, matGreen); m.rotation.y = -Math.PI/2; m.position.set( BOX.x, BOX.y, 0); cornell.add(m); }

  // emissive ceiling panel — exposed as a uniform so the GUI can retune live.
  const lightPanelMat = new MeshBasicNodeMaterial({ color: 0xffffff });
  const uPanelColor = TSL.uniform(new THREE.Vector3(8.0, 8.0, 7.0));
  try {
    lightPanelMat.colorNode = uPanelColor;
    lightPanelMat.toneMapped = false;
    bc('lightPanel.colorNode = uniform OK');
  } catch (e) {
    bc('lightPanel.colorNode failed: ' + e.message);
  }
  const lightPanel = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.45), lightPanelMat);
  lightPanel.rotation.x = Math.PI/2;
  lightPanel.position.set(0, 2*BOX.y - 0.001, 0);
  cornell.add(lightPanel);

  // Phase 5 calibration — direct lighting via point light (RectAreaLight + NodeMaterial
  // is fragile in r172). The WebGL scene uses RectAreaLight(intensity=18) over a
  // 0.55×0.45 panel, which radiates ~14 lm into the scene's hemisphere. A PointLight
  // emitting omnidirectionally at the same intensity puts ~4π× more flux into the
  // scene and ~8× more flux into the relevant hemisphere — so the same nominal
  // intensity drives probes to multi-bounce-saturate (white walls clip, magenta SH
  // artifacts where probes inside boxes contribute large mismatched values).
  // Compensate by reducing PointLight intensity to a value that approximates the
  // RectAreaLight's hemispherical flux. 2.5 was tuned empirically against the WebGL
  // reference at intensity 1.0 with /π applied.
  const keyLight = new THREE.PointLight(0xfff8e8, 2.5, 0, 1.0);
  keyLight.position.set(0, 2*BOX.y - 0.05, 0);
  scene.add(keyLight);

  // HemisphereLight as a soft fill: vertical surfaces (box sides, walls)
  // would otherwise receive almost no direct light from the ceiling
  // PointLight, leaving them black until indirect bounce kicks in. The sky
  // colour matches the panel and the ground colour is a dim cool grey, so
  // this acts as a cheap surrogate for the bounce floor + ceiling that DDGI
  // will refine on top.
  const hemiLight = new THREE.HemisphereLight(0xfff8e8, 0x202028, 0.25);
  hemiLight.position.set(0, 2*BOX.y, 0);
  scene.add(hemiLight);

  if (simpleScene) {
    const centerBox = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.75, 0.75, BOX_SEGMENTS, BOX_SEGMENTS, BOX_SEGMENTS), matWhite);
    centerBox.position.set(0, 0.375, 0.1);
    centerBox.rotation.y = THREE.MathUtils.degToRad(26);
    addBoxWireframe(centerBox);
    cornell.add(centerBox);
  } else {
    const tallBox = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.1, 0.55, BOX_SEGMENTS, BOX_SEGMENTS * 2, BOX_SEGMENTS), matWhite);
    tallBox.position.set(-0.3, 0.55, -0.3);
    tallBox.rotation.y = THREE.MathUtils.degToRad(18);
    addBoxWireframe(tallBox);
    cornell.add(tallBox);

    const shortBox = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55, BOX_SEGMENTS, BOX_SEGMENTS, BOX_SEGMENTS), matWhite);
    shortBox.position.set(0.32, 0.275, 0.28);
    shortBox.rotation.y = THREE.MathUtils.degToRad(-18);
    addBoxWireframe(shortBox);
    cornell.add(shortBox);
  }

  bc(simpleScene ? 'simple DDGI test room built' : 'Cornell box built');

  const WEBGPU_PROBE_TARGET_TYPE = THREE.HalfFloatType;
  const WEBGPU_PROBE_FACE_SIZE = simpleScene ? 16 : 8;
  const WEBGPU_DEPTH_RANGE = 50;
  const DEFAULT_CHEBYSHEV_ENABLED = simpleScene;
  const DEFAULT_CHEBYSHEV_FLOOR = simpleScene ? 0.02 : 0.15;
  const DEFAULT_GI_TRANSPORT_MODE = simpleScene ? 2 : 0;

  // ---- SH storage as TSL uniformArray (Phase 4 — DataTexture-free) ----
  // We learned via the diagnostic selector that DataTexture uploads to WebGPU
  // were silently failing — texture(probeSHTex, ...) returned vec3(0). Switching
  // to a flat Vector3 array exposed as TSL uniformArray sidesteps the
  // 2D-float-texture upload path entirely. 27 probes × 9 vec3 = 243 entries,
  // ~6.75 KB — well within WebGPU's uniform buffer limits.
  const SH_COEFFS = 9;
  const probeSHFlat = [];
  for (let i = 0; i < PROBE_COUNT * SH_COEFFS; i++) probeSHFlat.push(new THREE.Vector3());

  function uploadProbeSHToTex(idx, sh) {
    const base = idx * SH_COEFFS;
    for (let k = 0; k < 9; k++) {
      probeSHFlat[base + k].set(
        finiteClamp(sh[k].x, -64, 64),
        finiteClamp(sh[k].y, -64, 64),
        finiteClamp(sh[k].z, -64, 64)
      );
    }
  }

  // ---- TSL: GI sampling node graph (Phase 4) ----
  // Diagnostic phases (selectable at runtime via uGiMode uniform):
  //   0 = OFF      — no emissive contribution (baseline: direct lighting only)
  //   1 = CONST    — constant orange tint (verifies emissiveNode plumbing)
  //   2 = POS_TINT — RGB = world-space position normalised in probe grid bounds
  //                  (verifies positionWorld is accessible in fragment stage)
  //   3 = NORMAL   — RGB = world normal mapped to [0,1]
  //                  (verifies normalWorld is accessible)
  //   4 = SH0      — SH probe[0] only, no trilinear (verifies texture sampling + SH eval math)
  //   5 = SH_TRI   — full trilinear-blended SH GI (production path)
  bc('building TSL GI graph');
  let uGiMode = null, uGiEnabled = null, uGiIntensity = null, uGiPiFactor = null, uGiTransportMode = null;
  let uProbeMin = null, uProbeMax = null, uProbeDims = null;
  // Phase 6 — declared in the outer scope so updateOneProbe (defined below the TSL
  // try-block) can use them; assigned inside the try-block where TSL is in scope.
  let uChebyshevEnabled = null, uDepthBias = null, uDepthProbePos = null, uChebyshevFloor = null;
  let probeDepthMeanArr = null, probeDepthMeanSqArr = null;
  let depthMat = null;
  try {
    const { Fn, vec2, vec3, float, int, uniform, uniformArray, positionWorld, normalWorld } = TSL;
    uProbeMin    = uniform(PROBE_MIN.clone());
    uProbeMax    = uniform(PROBE_MAX.clone());
    uProbeDims   = uniform(PROBE_DIMS.clone());
    // Phase 5a — match WebGL math: WebGL adds gi to iblIrradiance, then the standard
    // PBR shader multiplies by (diffuse / π) inside RE_IndirectDiffuse_Physical. So
    // WebGL's effective contribution is `gi × albedo / π × giIntensity` with default
    // intensity 1.0. We mirror that here by enabling the /π factor and using 1.0
    // intensity by default. The capture-loss workaround (3.0 boost without /π) is
    // replaced by Phase 5b's tone-mapping-bypass-during-capture, which fixes the
    // radiance loss at its source instead of compensating downstream.
    uGiIntensity = uniform(1.0);             // matches WebGL default
    uGiEnabled   = uniform(1.0);
    uGiMode      = uniform(5.0);             // full trilinear by default
    uGiPiFactor  = uniform(1.0);             // /π by default — matches WebGL Lambertian BRDF
    uGiTransportMode = uniform(DEFAULT_GI_TRANSPORT_MODE);

    // SH coefficients exposed as TSL uniformArray of vec3 (length PROBE_COUNT * 9).
    const probeSHArray = uniformArray(probeSHFlat, 'vec3');

    // === Phase 6 — depth-aware Chebyshev visibility ===
    // Per-probe mean depth & mean-depth-squared. Initialised to "very far" so
    // probes whose depth pass hasn't completed yet contribute at full weight,
    // letting GI ramp up smoothly during priming. Once a probe's depth is
    // captured, the values settle to the actual occluder distances and the
    // Chebyshev test in giSampleFn culls probes that the shading point cannot
    // "see". This is the proper DDGI correctness fix for probes-inside-boxes.
    probeDepthMeanArr   = new Array(PROBE_COUNT).fill(100.0);
    probeDepthMeanSqArr = new Array(PROBE_COUNT).fill(10000.0);
    const uDepthMean        = uniformArray(probeDepthMeanArr,   'float');
    const uDepthMeanSq      = uniformArray(probeDepthMeanSqArr, 'float');
    uChebyshevEnabled       = uniform(DEFAULT_CHEBYSHEV_ENABLED ? 1.0 : 0.0);
    uDepthBias              = uniform(0.05);
    // Minimum visibility weight for occluded probes. A nonzero floor keeps
    // probes inside boxes contributing their DC ambient, which prevents the
    // hard cell seams that show up as bright "blob" patches.
    uChebyshevFloor         = uniform(DEFAULT_CHEBYSHEV_FLOOR);

    // Depth-output material. During the second cube-camera pass per probe, this
    // overrides the scene materials so each fragment writes its world-space
    // distance to the current probe instead of radiance. Read back, integrated
    // to mean & mean-squared, and uploaded to the uniform arrays above.
    uDepthProbePos = uniform(new THREE.Vector3());
    const fragDist = positionWorld.sub(uDepthProbePos).length().min(WEBGPU_DEPTH_RANGE);
    depthMat = new MeshBasicNodeMaterial();
    depthMat.colorNode  = vec3(fragDist.mul(1 / WEBGPU_DEPTH_RANGE));
    depthMat.toneMapped = false;

    // Read SH coefficient k for probe pi (pi is a float node).
    // We need an integer index into the array; convert float→int.
    const readSH = (probeIdxFloat, k) => {
      const idxInt = int(probeIdxFloat).mul(int(9)).add(int(k));
      return probeSHArray.element(idxInt);
    };

    // Standard L2 SH evaluation in direction n, for probe pi.
    // readSH returns vec3 (uniformArray element), so the chain stays vec3 throughout.
    const evalSH = (n, probeIdxFloat) => {
      const x = n.x, y = n.y, z = n.z;
      const c0 = readSH(probeIdxFloat, 0);
      const c1 = readSH(probeIdxFloat, 1);
      const c2 = readSH(probeIdxFloat, 2);
      const c3 = readSH(probeIdxFloat, 3);
      const c4 = readSH(probeIdxFloat, 4);
      const c5 = readSH(probeIdxFloat, 5);
      const c6 = readSH(probeIdxFloat, 6);
      const c7 = readSH(probeIdxFloat, 7);
      const c8 = readSH(probeIdxFloat, 8);
      return c0.mul(0.886227)
        .add(c1.mul(2.0 * 0.511664).mul(y))
        .add(c2.mul(2.0 * 0.511664).mul(z))
        .add(c3.mul(2.0 * 0.511664).mul(x))
        .add(c4.mul(2.0 * 0.429043).mul(x).mul(y))
        .add(c5.mul(2.0 * 0.429043).mul(y).mul(z))
        .add(c6.mul(z.mul(z).mul(0.743125).sub(0.247708)))
        .add(c7.mul(2.0 * 0.429043).mul(x).mul(z))
        .add(c8.mul(0.429043).mul(x.mul(x).sub(y.mul(y))));
    };

    // Trilinear blend across 8 surrounding probes, with Phase 6 Chebyshev
    // visibility weighting. For each corner probe, in addition to the standard
    // trilinear weight (volume of the opposite sub-cube), we compute a
    // visibility weight from the probe's depth statistics — this is what makes
    // probes-inside-boxes get culled instead of contributing wrong radiance.
    // True trilinear DDGI sampling: each shading point only blends the 8 probes
    // that are the corners of the grid cell it sits in. The 8 weights are the
    // standard trilinear weights (volumes of the opposite sub-cube), optionally
    // multiplied by Chebyshev visibility so that probes the point cannot "see"
    // (e.g. probes inside boxes) drop out of the blend.
    const giSampleFn = Fn(([wp, n]) => {
      // Convert world position to grid coordinates [0, Dim-1] along each axis.
      const grid = wp.sub(uProbeMin).div(uProbeMax.sub(uProbeMin))
                   .clamp(vec3(0.0), vec3(1.0))
                   .mul(uProbeDims.sub(vec3(1.0)));
      // Clamp the base index so base+1 stays inside the grid for points on the
      // far face. The floor of (clamped grid) is the lower corner of the cell.
      const baseIdx = grid.min(uProbeDims.sub(vec3(1.0001))).floor();
      // Trilinear fractions are computed against the *clamped* base, so a point
      // exactly on the far face uses frac = 1 (full weight to the +1 corner).
      const fracIdx = grid.sub(baseIdx).clamp(vec3(0.0), vec3(1.0));
      const probeSpacing = uProbeMax.sub(uProbeMin).div(uProbeDims.sub(vec3(1.0)));

      // Match uploadProbeSHToTex layout: flatIdx = iz*Dx*Dy + iy*Dx + ix.
      const Dx   = uProbeDims.x;
      const DxDy = uProbeDims.x.mul(uProbeDims.y);

      // Surface bias — push the shading position slightly along the normal
      // before evaluating the depth occlusion test. Without this, fragments
      // sitting on a wall almost always fail Chebyshev (their distance to the
      // nearest probe roughly equals the probe's mean depth, so distExcess
      // wobbles around zero and produces blocky cell edges).
      const wpBiased = wp.add(n.mul(uDepthBias));

      let sum  = vec3(0.0).toVar();
      let wSum = float(0.0).toVar();

      for (let cz = 0; cz < 2; cz++) {
        for (let cy = 0; cy < 2; cy++) {
          for (let cx = 0; cx < 2; cx++) {
            const ix = baseIdx.x.add(float(cx));
            const iy = baseIdx.y.add(float(cy));
            const iz = baseIdx.z.add(float(cz));

            const tx = cx === 0 ? float(1.0).sub(fracIdx.x) : fracIdx.x;
            const ty = cy === 0 ? float(1.0).sub(fracIdx.y) : fracIdx.y;
            const tz = cz === 0 ? float(1.0).sub(fracIdx.z) : fracIdx.z;
            // Smooth the trilinear weight a bit — pure linear weights produce
            // visible C0 seams between cells in low-res grids; cubic weights
            // (3t²−2t³) give continuous derivatives across cell boundaries.
            const sx = tx.mul(tx).mul(float(3.0).sub(tx.mul(2.0)));
            const sy = ty.mul(ty).mul(float(3.0).sub(ty.mul(2.0)));
            const sz = tz.mul(tz).mul(float(3.0).sub(tz.mul(2.0)));
            const triWeight = sx.mul(sy).mul(sz);

            const flatF = iz.mul(DxDy).add(iy.mul(Dx)).add(ix);
            const piInt = int(flatF);
            const pi    = float(flatF);

            // Chebyshev visibility on the *biased* shading point. Soft falloff
            // (no min cap on chebyshev) so edges blend instead of stepping.
            const idxV       = vec3(ix, iy, iz);
            const probeWorld = uProbeMin.add(idxV.mul(probeSpacing));
            const dist       = wpBiased.sub(probeWorld).length();
            const dMean      = uDepthMean.element(piInt);
            const dMeanSq    = uDepthMeanSq.element(piInt);
            const variance   = dMeanSq.sub(dMean.mul(dMean)).max(float(1e-4));
            const distExcess = dist.sub(dMean).max(float(0.0));
            const chebyshev  = variance.div(variance.add(distExcess.mul(distExcess))).clamp(0.0, 1.0);
            // Keep a configurable floor so cells with all-occluded probes
            // still contribute (their DC ambient) rather than turning hard
            // black. The floor is what stops probe-cell seams from showing
            // up as bright "blob" patches.
            const visWeight  = uChebyshevFloor.mix(chebyshev, uChebyshevEnabled).max(uChebyshevFloor);

            const weight = triWeight.mul(visWeight).max(float(1e-5));

            // Hue-preserving SH clamp: the directional reconstruction can dip
            // below zero on individual channels (band-1/2 basis is signed).
            // Smoothly fade toward the DC ambient as the worst channel goes
            // negative, so probes contribute a non-negative, non-hue-shifted
            // colour.
            const sampleN = n.mul(vec3(-1.0, 1.0, 1.0));
            const irrRaw = evalSH(sampleN, pi);
            const c0Amb  = readSH(pi, 0).mul(0.886227).max(vec3(0.0));
            const minCh  = irrRaw.x.min(irrRaw.y).min(irrRaw.z);
            // Ringing fallback uses the *magnitude* of the DC ambient as the
            // negative-excursion scale. Tiny DC values can no longer drag the
            // ringing trigger toward zero (was the source of magenta splotches
            // on dim probes near the colored walls). Floored at 1e-3 so utterly
            // dark probes still don't divide by zero.
            const dcMag    = c0Amb.length().max(float(1e-3));
            const negDepth = minCh.negate().max(float(0.0));
            const ringing  = negDepth.div(dcMag.mul(float(0.5))).clamp(float(0.0), float(1.0));
            const irr      = irrRaw.max(vec3(0.0)).mix(c0Amb, ringing);

            sum  = sum.add(irr.mul(weight));
            wSum = wSum.add(weight);
          }
        }
      }
      return sum.div(wSum.max(float(1e-4)));
    });

    bc('TSL GI graph built');

    // Tiny float helper: returns 1 if mode is approximately equal to target, else 0.
    // Avoids relying on TSL .equal()/select() — uses smooth arithmetic instead so it
    // compiles cleanly across TSL revisions.
    const modeMask = (target) => {
      const d = uGiMode.sub(float(target)).abs();
      // 1.0 when |mode - target| < 0.5, else 0.0
      return float(0.5).sub(d).max(float(0.0)).mul(2.0).clamp(0.0, 1.0);
    };

    const transportMask = (target) => {
      const d = uGiTransportMode.sub(float(target)).abs();
      return float(0.5).sub(d).max(float(0.0)).mul(2.0).clamp(0.0, 1.0);
    };

    // Wire each material's emissiveNode to a sum of phase-gated contributions.
    for (const m of [matWhite, matRed, matGreen]) {
      const N = normalWorld.normalize();

      // Phase 1: constant orange tint (~0.4 brightness, easy to see)
      const cConst = vec3(0.20, 0.10, 0.0);

      // Phase 2: world-position tint (dimmed). Maps grid-space [0,1] → RGB.
      const wp01 = positionWorld.sub(uProbeMin).div(uProbeMax.sub(uProbeMin)).clamp(vec3(0.0), vec3(1.0));
      const cPos = wp01.mul(0.4);

      // Phase 3: world-normal tint. Map [-1,1] → [0,1].
      const cNormal = N.mul(0.5).add(vec3(0.5)).mul(0.4);

      // Phase 4: read SH band-0 for probe[0] DIRECTLY via uniformArray. No eval,
      // no trilinear — purest diagnostic of the upload path. If probe data is
      // present, we see a near-uniform tint of probe[0]'s ambient irradiance.
      // (DataTexture didn't reach the bind group; uniformArray bypasses that.)
      const probeSHRead = probeSHArray.element(int(0));
      const cSh0 = probeSHRead.max(vec3(0.0)).mul(0.5);

      // Phase 5: full GI transport. Keep the emissive debug route available, but
      // allow the simple scene to default to true irradiance injection so the
      // bounce reads like diffuse light instead of glowing paint.
      const giRaw = giSampleFn(positionWorld, N);
      const giClamped = giRaw.max(vec3(0.0));
      const piFactor = float(1.0).mix(float(1.0/Math.PI), uGiPiFactor);
      const cFullDebug = giClamped.mul(piFactor).mul(0.55);
      const cFullSoft = giClamped.mul(piFactor).mul(0.22);
      const giIrradiance = giClamped;
      const fullMask = modeMask(5);

      // Sum up phase-gated contributions; only one mask is non-zero at a time.
      const emissive = cConst.mul(modeMask(1))
                  .add( cPos.mul(modeMask(2)) )
                  .add( cNormal.mul(modeMask(3)) )
                  .add( cSh0.mul(modeMask(4)) )
                  .add( cFullDebug.mul(fullMask).mul(transportMask(0)) )
                  .add( cFullSoft.mul(fullMask).mul(transportMask(1)) );

      m.emissiveNode = emissive.mul(uGiEnabled).mul(uGiIntensity);
      m.ddgiIrradianceNode = giIrradiance.mul(fullMask).mul(transportMask(2)).mul(uGiEnabled).mul(uGiIntensity);
    }
    bc('GI transport wired with emissive + irradiance modes');
  } catch (e) {
    bc('TSL graph FAILED: ' + e.message);
    console.error('TSL graph build failed', e);
  }

  // ---- Probe Grid + capture (Phase 3) ----
  bc('building probe grid');
  const probePositions = [];
  const probeRadianceRT = [];
  const cubeCameras = [];
  // probe SH stored as Vector3[9] per probe
  const probesSH = [];

  for (let z=0; z<PROBE_DIMS.z; z++) for (let y=0; y<PROBE_DIMS.y; y++) for (let x=0; x<PROBE_DIMS.x; x++) {
    const p = new THREE.Vector3(
      THREE.MathUtils.lerp(PROBE_MIN.x, PROBE_MAX.x, x/(PROBE_DIMS.x-1)),
      THREE.MathUtils.lerp(PROBE_MIN.y, PROBE_MAX.y, y/(PROBE_DIMS.y-1)),
      THREE.MathUtils.lerp(PROBE_MIN.z, PROBE_MAX.z, z/(PROBE_DIMS.z-1))
    );
    probePositions.push(p);
    const rt = new THREE.WebGLCubeRenderTarget(WEBGPU_PROBE_FACE_SIZE, {
      format: THREE.RGBAFormat, type: WEBGPU_PROBE_TARGET_TYPE,
      generateMipmaps: false, colorSpace: THREE.LinearSRGBColorSpace
    });
    probeRadianceRT.push(rt);
    const cam = new THREE.CubeCamera(0.01, 20, rt);
    cam.position.copy(p);
    scene.add(cam);
    cubeCameras.push(cam);
    const sh = []; for (let k=0; k<9; k++) sh.push(new THREE.Vector3());
    probesSH.push(sh);
  }
  bc(`${PROBE_COUNT} probes initialised`);

  // Debug visualisation: spheres at probe positions, colored by ambient SH band.
  const debugProbeGroup = new THREE.Group();
  debugProbeGroup.visible = false;
  scene.add(debugProbeGroup);
  const debugSpheres = [];
  for (let i=0; i<PROBE_COUNT; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.025, 12, 8),
      new MeshBasicNodeMaterial({ color: 0x222222 })
    );
    m.position.copy(probePositions[i]);
    debugProbeGroup.add(m);
    debugSpheres.push(m);
  }

  // SH integration helpers (pure JS, no TSL involvement)
  const FACE_SIZE = WEBGPU_PROBE_FACE_SIZE;
  const COS_BAND = [Math.PI, 2*Math.PI/3, 2*Math.PI/3, 2*Math.PI/3,
                    Math.PI/4, Math.PI/4, Math.PI/4, Math.PI/4, Math.PI/4];
  const FACE_DIRS = [];
  for (let f=0; f<6; f++) {
    const arr = [];
    for (let v=0; v<FACE_SIZE; v++) for (let u=0; u<FACE_SIZE; u++) {
      const fu = (u + 0.5) / FACE_SIZE * 2 - 1;
      const fv = (v + 0.5) / FACE_SIZE * 2 - 1;
      let xx,yy,zz;
      switch(f) {
        case 0: xx =-1; yy =-fv; zz =-fu; break;
        case 1: xx = 1; yy =-fv; zz = fu; break;
        case 2: xx =-fu; yy = 1; zz = fv; break;
        case 3: xx =-fu; yy =-1; zz =-fv; break;
        case 4: xx =-fu; yy =-fv; zz = 1; break;
        case 5: xx = fu; yy =-fv; zz =-1; break;
      }
      const len = Math.sqrt(xx*xx+yy*yy+zz*zz);
      arr.push({ x: xx/len, y: yy/len, z: zz/len, w: 4 / ((1 + fu*fu + fv*fv) * len) });
    }
    FACE_DIRS.push(arr);
  }
  function f16ToF32(h) {
    const s = (h & 0x8000) >> 15, e = (h & 0x7C00) >> 10, ff = h & 0x03FF;
    if (e === 0) return (s ? -1 : 1) * Math.pow(2, -14) * (ff / 1024);
    if (e === 0x1F) return ff ? NaN : ((s ? -1 : 1) * Infinity);
    return (s ? -1 : 1) * Math.pow(2, e - 15) * (1 + ff / 1024);
  }
  function finiteClamp(v, lo, hi, fallback = 0) {
    if (!Number.isFinite(v)) return fallback;
    return Math.max(lo, Math.min(hi, v));
  }
  function readLinearChannel(data, offset, isDistance = false) {
    let v = data[offset];
    if (data instanceof Uint16Array) v = f16ToF32(v);
    else if (data instanceof Uint8Array || data instanceof Uint8ClampedArray) v = v / 255;
    if (isDistance) v *= WEBGPU_DEPTH_RANGE;
    return finiteClamp(v, 0, isDistance ? 50 : 64, isDistance ? NaN : 0);
  }
  function shBasis(d) {
    const xx=d.x, yy=d.y, zz=d.z;
      return [0.282095, 0.488603*yy, 0.488603*zz, 0.488603*xx,
        1.092548*xx*yy, 1.092548*yy*zz, 0.315392*(3*zz*zz-1),
        1.092548*xx*zz, 0.546274*(xx*xx-yy*yy)];
  }

  // ── WebGPU readback workaround ─────────────────────────────────────────────
  // three.js r172's WebGPUTextureUtils.copyTextureToBuffer allocates a staging
  // buffer of `width*height*bytesPerTexel`, but copyTextureToBuffer requires
  // bytesPerRow aligned to 256, so the copy fails with
  //   "Required size for texture data layout (3904) exceeds the linear data size (1024)".
  // We drive the WebGPU device directly and copy all 6 cube faces in a single
  // command encoder + single mapAsync wait, with a pooled per-(format,size)
  // staging buffer so probe captures stay cheap (no per-call buffer churn).
  const _readbackPool = new Map();   // key → { bufferAll, paddedRowBytes, tightRowBytes, faceBytes, TypedArray }

  function _formatInfo(format) {
    switch (format) {
      case 'rgba8unorm':
      case 'rgba8unorm-srgb': return { bytesPerTexel: 4,  TypedArray: Uint8Array };
      case 'rgba16float':     return { bytesPerTexel: 8,  TypedArray: Uint16Array };
      case 'rgba32float':     return { bytesPerTexel: 16, TypedArray: Float32Array };
      default: return null;
    }
  }

  function _getPool(device, format, width, height) {
    const key = `${format}|${width}x${height}`;
    let entry = _readbackPool.get(key);
    if (entry) return entry;
    const info = _formatInfo(format);
    if (!info) return null;
    const tightRowBytes  = width * info.bytesPerTexel;
    const paddedRowBytes = Math.ceil(tightRowBytes / 256) * 256;
    const faceBytes      = paddedRowBytes * height;
    entry = {
      paddedRowBytes,
      tightRowBytes,
      faceBytes,
      TypedArray: info.TypedArray,
      bufferAll: device.createBuffer({
        size: faceBytes * 6,
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
      }),
    };
    _readbackPool.set(key, entry);
    return entry;
  }

  // Reads all 6 faces of the supplied cube RT in one round-trip and returns
  // an array of 6 tightly-packed typed arrays (no row padding).
  async function readAllCubeFaces(rt) {
    const backend = renderer.backend;
    const device = backend && backend.device;
    if (!device) return null;
    const texture = rt.textures[0];
    const textureData = backend.get(texture);
    if (!textureData || !textureData.texture) return null;
    const gpuTexture = textureData.texture;
    const format = textureData.textureDescriptorGPU.format;

    const width  = FACE_SIZE;
    const height = FACE_SIZE;
    const pool = _getPool(device, format, width, height);
    if (!pool) return null;
    const { bufferAll, paddedRowBytes, tightRowBytes, faceBytes, TypedArray } = pool;

    const encoder = device.createCommandEncoder();
    for (let f = 0; f < 6; f++) {
      encoder.copyTextureToBuffer(
        { texture: gpuTexture, origin: { x: 0, y: 0, z: f } },
        { buffer: bufferAll, offset: f * faceBytes, bytesPerRow: paddedRowBytes, rowsPerImage: height },
        { width, height, depthOrArrayLayers: 1 }
      );
    }
    device.queue.submit([encoder.finish()]);

    await bufferAll.mapAsync(GPUMapMode.READ);
    const mapped = new Uint8Array(bufferAll.getMappedRange());
    const result = new Array(6);
    for (let f = 0; f < 6; f++) {
      const tight = new Uint8Array(tightRowBytes * height);
      const base = f * faceBytes;
      for (let row = 0; row < height; row++) {
        tight.set(
          mapped.subarray(base + row * paddedRowBytes, base + row * paddedRowBytes + tightRowBytes),
          row * tightRowBytes
        );
      }
      result[f] = new TypedArray(tight.buffer);
    }
    bufferAll.unmap();
    return result;
  }

  // Single-face wrapper retained for callers that still want per-face access.
  // Internally it always reads the whole cube — fine for our usage since the
  // only callers do all six faces back-to-back anyway.
  async function readCubeFace(rt, face) {
    const all = await readAllCubeFaces(rt);
    if (!all) {
      return renderer.readRenderTargetPixelsAsync(rt, 0, 0, FACE_SIZE, FACE_SIZE, 0, face);
    }
    return all[face];
  }

  async function integrateSH(rt) {
    const sh = []; for (let k=0; k<9; k++) sh.push({x:0,y:0,z:0});
    const allFaces = await readAllCubeFaces(rt) ||
      await Promise.all([0,1,2,3,4,5].map(f => readCubeFace(rt, f)));
    for (let f=0; f<6; f++) {
      const data = allFaces[f];
      const dirs = FACE_DIRS[f];
      for (let i=0; i<FACE_SIZE*FACE_SIZE; i++) {
        const r = readLinearChannel(data, i*4+0);
        const g = readLinearChannel(data, i*4+1);
        const b = readLinearChannel(data, i*4+2);
        const d = dirs[i];
        const basis = shBasis(d);
        for (let k=0; k<9; k++) {
          const w = basis[k] * d.w;
          sh[k].x += r * w;
          sh[k].y += g * w;
          sh[k].z += b * w;
        }
      }
    }
    for (let k=0; k<9; k++) {
      sh[k].x = finiteClamp(sh[k].x * COS_BAND[k], -64, 64);
      sh[k].y = finiteClamp(sh[k].y * COS_BAND[k], -64, 64);
      sh[k].z = finiteClamp(sh[k].z * COS_BAND[k], -64, 64);
    }
    return sh;
  }

  function shEnergy(sh) {
    return Math.abs(sh[0].x) + Math.abs(sh[0].y) + Math.abs(sh[0].z);
  }

  // Fallback SH derived analytically from the *current* wall + light colors so
  // that GUI tweaks visibly affect indirect light even when readback is broken
  // (WebGPU r172's readRenderTargetPixelsAsync currently mis-sizes the staging
  // buffer for cube targets — see bc('probe readback returned black; ...').
  function makeFallbackSH(idx) {
    const p = probePositions[idx];
    const x01 = (p.x - PROBE_MIN.x) / (PROBE_MAX.x - PROBE_MIN.x);
    const y01 = (p.y - PROBE_MIN.y) / (PROBE_MAX.y - PROBE_MIN.y);
    const z01 = (p.z - PROBE_MIN.z) / (PROBE_MAX.z - PROBE_MIN.z);
    const ceiling = Math.max(0, y01);
    const center = 1 - Math.min(1, Math.hypot(x01 - 0.5, z01 - 0.5) * 1.9);
    const redBleed   = Math.pow(Math.max(0, 1 - x01), 1.7); // -X wall (matRed)
    const greenBleed = Math.pow(Math.max(0, x01), 1.7);     // +X wall (matGreen)
    const sh = []; for (let k=0; k<9; k++) sh.push({x:0,y:0,z:0});

    // Sample current scene colors so GUI edits propagate.
    const red   = matRed.color;
    const green = matGreen.color;
    const white = matWhite.color;
    const panel = uPanelColor.value;       // emissive ceiling panel (HDR)
    const keyI  = keyLight.intensity;
    const keyC  = keyLight.color;

    // Direct contribution from the ceiling light + emissive panel — felt most
    // strongly by probes near the ceiling and toward the room centre.
    const lit = 0.04 * keyI;
    const ambR = lit * keyC.r + 0.012 * panel.x;
    const ambG = lit * keyC.g + 0.012 * panel.y;
    const ambB = lit * keyC.b + 0.012 * panel.z;

    // Band 0 (DC): white walls + colored side bleed + key/panel ambient.
    sh[0].x = 0.10 * white.r + 0.22 * white.r * ceiling + 0.20 * red.r   * redBleed   + 0.06 * white.r * center + ambR;
    sh[0].y = 0.10 * white.g + 0.22 * white.g * ceiling + 0.20 * green.g * greenBleed + 0.06 * white.g * center + ambG;
    sh[0].z = 0.10 * white.b + 0.18 * white.b * ceiling + 0.04 * white.b * center + ambB;

    // Add a little upward/downward variation so the fallback is not perfectly flat.
    sh[2].x = -0.04 * ceiling * white.r;
    sh[2].y = -0.04 * ceiling * white.g;
    sh[2].z = -0.03 * ceiling * white.b;

    // Y-axis colored bleed: red on -X, green on +X (band 3 ~ -x basis).
    sh[3].x = -0.08 * red.r   * redBleed;
    sh[3].y = -0.08 * green.g * greenBleed;
    sh[3].z =  0.0;
    return sh;
  }

  // Phase 6 — integrate per-probe depth statistics (mean & mean-squared) from a
  // cube-camera target rendered with the depth-output material. Uniform per-texel
  // weighting is fine here: these are aggregate stats, not direction-dependent
  // SH — they encode "how far does this probe see, on average, plus variance".
  async function integrateDepthStats(rt) {
    let sum = 0, sumSq = 0, count = 0;
    const allFaces = await readAllCubeFaces(rt) ||
      await Promise.all([0,1,2,3,4,5].map(f => readCubeFace(rt, f)));
    for (let f=0; f<6; f++) {
      const data = allFaces[f];
      for (let i=0; i<FACE_SIZE*FACE_SIZE; i++) {
        const d = readLinearChannel(data, i*4+0, true);
        if (!Number.isFinite(d)) continue;
        sum   += d;
        sumSq += d * d;
        count++;
      }
    }
    if (!count) return { mean: 100.0, meanSq: 10000.0 };
    const mean = finiteClamp(sum / count, 0, 50, 100.0);
    const meanSq = Math.max(mean * mean, finiteClamp(sumSq / count, 0, 2500, mean * mean));
    return { mean, meanSq };
  }

  // declare stats early so probe capture can update the UI during startup bakes
  const stats = new Stats();
  let useAnalyticFallback = false;
  let readbackFallbackCount = 0;
  // Materials whose tone mapping must be suppressed during cube-camera probe capture.
  // In WebGPU r172, tone mapping is compiled into NodeMaterial shader graphs, so
  // toggling `renderer.toneMapping = NoToneMapping` mid-frame does not always
  // propagate to already-built materials — captures end up ACES-compressed,
  // discarding ~3× of the HDR radiance from the emissive panel and any
  // GI-emissive feedback. Forcing `material.toneMapped = false` per-material
  // during capture guarantees the linear path. lightPanelMat is already configured
  // with `toneMapped = false` at construction, so we only need the wall mats here.
  const captureMats = [matWhite, matRed, matGreen];

  function setDebugProbeColor(idx, sh) {
    const sc = 1.0 / 3.5449;
    const c = sh[0];
    debugSpheres[idx].material.color.setRGB(
      finiteClamp(c.x * sc, 0, 1),
      finiteClamp(c.y * sc, 0, 1),
      finiteClamp(c.z * sc, 0, 1)
    );
  }

  function applyProbeResult(idx, sh, depthStats) {
    for (let k = 0; k < 9; k++) probesSH[idx][k].set(sh[k].x, sh[k].y, sh[k].z);
    uploadProbeSHToTex(idx, sh);
    setDebugProbeColor(idx, sh);
    if (depthStats) {
      probeDepthMeanArr[idx] = depthStats.mean;
      probeDepthMeanSqArr[idx] = depthStats.meanSq;
    }
  }

  async function updateOneProbe(idx, options = {}) {
    const captureDepth = !!options.captureDepth;
    const cam = cubeCameras[idx];
    cam.position.copy(probePositions[idx]);
    const wasDebug = debugProbeGroup.visible;
    const prevGiEnabled = uGiEnabled ? uGiEnabled.value : null;
    debugProbeGroup.visible = false;
    try {
      if (!useAnalyticFallback) {
        const oldTM = renderer.toneMapping;
        const oldToneMapped = captureMats.map(m => m.toneMapped);
        renderer.toneMapping = THREE.NoToneMapping;
        try {
      // Phase 5b — bypass tone mapping at the material level (belt-and-braces with
      // the renderer-level toggle above). Without this, the captured radiance is
      // ACES-compressed, which is the root cause of the "subtle GI" symptom.
          if (uGiEnabled) uGiEnabled.value = 0.0;
          for (const m of captureMats) m.toneMapped = false;
          cam.update(renderer, scene);
        } finally {
          if (uGiEnabled && prevGiEnabled !== null) uGiEnabled.value = prevGiEnabled;
          for (let i = 0; i < captureMats.length; i++) captureMats[i].toneMapped = oldToneMapped[i];
          renderer.toneMapping = oldTM;
        }
      }

      try {
        let sh = useAnalyticFallback ? makeFallbackSH(idx) : await integrateSH(probeRadianceRT[idx]);
        if (!useAnalyticFallback && shEnergy(sh) < 1e-4) {
          useAnalyticFallback = true;
          sh = makeFallbackSH(idx);
          readbackFallbackCount++;
          if (readbackFallbackCount === 1) {
            bc('probe readback returned black; using analytic fallback probes');
          }
        }
        let depthStats = null;

        // Phase 6 — depth pass for Chebyshev visibility. Re-render this probe's
        // cube map with the depth-output material so each fragment writes its
        // distance to the probe instead of radiance, then integrate to mean &
        // mean-squared. This overwrites the radiance in probeRadianceRT[idx],
        // which is fine because we already extracted the SH coefficients above.
        if (captureDepth && !useAnalyticFallback && depthMat && uDepthProbePos) {
          uDepthProbePos.value.copy(probePositions[idx]);
          const prevOverride = scene.overrideMaterial;
          const oldTM2 = renderer.toneMapping;
          renderer.toneMapping = THREE.NoToneMapping;
          scene.overrideMaterial = depthMat;
          cam.update(renderer, scene);
          scene.overrideMaterial = prevOverride;
          renderer.toneMapping = oldTM2;
          try {
            const ds = await integrateDepthStats(probeRadianceRT[idx]);
            const mean = finiteClamp(ds.mean, 0, 50, 100.0);
            depthStats = {
              mean,
              meanSq: Math.max(mean * mean, finiteClamp(ds.meanSq, 0, 2500, 10000.0))
            };
          } catch (e) {
            console.warn(`Probe ${idx} depth integration failed:`, e.message);
          }
        }
        stats.totalProbeUpdates++;
        return { sh, depthStats };
      } catch (e) {
        console.warn(`Probe ${idx} integration failed:`, e.message, e.stack);
        if (idx === 0) bc('integrateSH failed: ' + e.message);
        return null;
      }
    } finally {
      debugProbeGroup.visible = wasDebug;
    }
  }

  // ── Atomic bake ────────────────────────────────────────────────────────────
  // The runtime path used to update one probe per frame, which exposed the
  // partially-updated grid: a freshly captured probe blended with stale
  // neighbours produced visible white/cream "blobs" on the walls. Instead we
  // do all probes in a single sweep and only publish the new SH after every
  // probe in that sweep has finished — the visible grid always represents one
  // consistent lighting solution. Keep startup to a single sweep and run it
  // after the first frame so the scene becomes interactive immediately.
  const STARTUP_BOUNCES = 1;
  const REBAKE_BOUNCES = 1;
  const REBAKE_DEBOUNCE_MS = 200;
  let bakeInFlight = false;
  let bakeRequested = false;
  let rebakeTimer = 0;

  function shouldBakeDepth() {
    return !!(uChebyshevEnabled && uChebyshevEnabled.value > 0.5);
  }

  async function bakeAllProbes(bounces = 1, options = {}) {
    const captureDepth = options.captureDepth ?? shouldBakeDepth();
    if (bakeInFlight) { bakeRequested = true; return; }
    bakeInFlight = true;
    try {
      do {
        bakeRequested = false;
        for (let bounce = 0; bounce < bounces; bounce++) {
          // Stage SH for every probe in turn but DO NOT publish to the shader
          // until the whole sweep is complete.
          const stagedSH = new Array(PROBE_COUNT);
          const stagedDepth = new Array(PROBE_COUNT);
          for (let idx = 0; idx < PROBE_COUNT; idx++) {
            const result = await updateOneProbe(idx, { captureDepth });
            if (result) {
              stagedSH[idx] = result.sh;
              stagedDepth[idx] = result.depthStats;
            }
            bc(`bake ${bounce + 1}/${bounces}: probe ${idx + 1}/${PROBE_COUNT}`);
          }
          // Atomic publish — every shader uniform updates within the same JS
          // task so the next render sees a fully consistent grid.
          for (let idx = 0; idx < PROBE_COUNT; idx++) {
            const sh = stagedSH[idx];
            if (!sh) continue;
            applyProbeResult(idx, sh, stagedDepth[idx]);
          }
        }
      } while (bakeRequested);
    } finally {
      bakeInFlight = false;
    }
  }

  function requestRebake() {
    if (rebakeTimer) {
      window.clearTimeout(rebakeTimer);
      rebakeTimer = 0;
    }
    bakeAllProbes(REBAKE_BOUNCES, { captureDepth: shouldBakeDepth() });
  }

  function scheduleRebake() {
    if (rebakeTimer) window.clearTimeout(rebakeTimer);
    rebakeTimer = window.setTimeout(() => {
      rebakeTimer = 0;
      bakeAllProbes(REBAKE_BOUNCES, { captureDepth: shouldBakeDepth() });
    }, REBAKE_DEBOUNCE_MS);
  }

  // ---- GUI ----
  const giModes = {
    '0 — off':            0,
    '1 — const orange':   1,
    '2 — pos tint':       2,
    '3 — normal tint':    3,
    '4 — SH probe[0]':    4,
    '5 — full trilinear': 5,
  };
  const giTransportModes = {
    '0 — emissive debug':    0,
    '1 — soft emissive':     1,
    '2 — diffuse irradiance': 2,
  };
  const params = {
    giMode: '5 — full trilinear',
    giTransport: Object.keys(giTransportModes).find((key) => giTransportModes[key] === DEFAULT_GI_TRANSPORT_MODE),
    exposure: 1.0,
    showProbes: false,
    boxWireframe: false,
    giEnabled: true,
    giIntensity: useAnalyticFallback ? 0.65 : 1.0,
    applyPiFactor: false,              // additive effect: keep the bounce pass visible
    chebyshevEnabled: DEFAULT_CHEBYSHEV_ENABLED,
    depthBias: 0.05,                   // Phase 6 — Chebyshev bias
    chebyshevFloor: DEFAULT_CHEBYSHEV_FLOOR,
    // light + scene tuning
    keyIntensity: keyLight.intensity,
    keyColor: '#' + keyLight.color.getHexString(),
    keyDecay: keyLight.decay,
    keyHeight: keyLight.position.y,
    panelR: uPanelColor.value.x, panelG: uPanelColor.value.y, panelB: uPanelColor.value.z,
    wallRed:   '#' + matRed.color.getHexString(),
    wallGreen: '#' + matGreen.color.getHexString(),
    wallWhite: '#' + matWhite.color.getHexString(),
    wallRoughness: matWhite.roughness,
    wallMetalness: matWhite.metalness,
    rebakeGI: () => requestRebake(),
  };
  const gui = new GUI({ title: 'DDGI · WebGPU (diagnostic)', width: 320 });

  const fGI = gui.addFolder('GI');
  if (uGiMode) fGI.add(params, 'giMode', Object.keys(giModes)).name('GI phase').onChange(v => {
    uGiMode.value = giModes[v];
    bc('GI phase → ' + v);
  });
  if (uGiTransportMode) fGI.add(params, 'giTransport', Object.keys(giTransportModes)).name('GI transport').onChange(v => {
    uGiTransportMode.value = giTransportModes[v];
    bc('GI transport → ' + v);
  });
  if (uGiEnabled)   fGI.add(params, 'giEnabled').name('GI enabled').onChange(v => uGiEnabled.value = v ? 1 : 0);
  if (uGiIntensity) uGiIntensity.value = params.giIntensity;
  // Phase 5a — slider range matches the WebGL scene (0..3) for direct A/B comparison.
  if (uGiIntensity) fGI.add(params, 'giIntensity', 0, 3, 0.05).name('GI intensity').onChange(v => uGiIntensity.value = v);
  if (uGiPiFactor) {
    uGiPiFactor.value = params.applyPiFactor ? 1 : 0;
    fGI.add(params, 'applyPiFactor').name('Apply 1/π factor').onChange(v => uGiPiFactor.value = v ? 1 : 0);
  }
  // Phase 6 — Chebyshev visibility test toggle + depth bias tuning.
  if (uChebyshevEnabled) fGI.add(params, 'chebyshevEnabled').name('Chebyshev visibility').onChange(v => {
    uChebyshevEnabled.value = v ? 1 : 0;
    if (v) scheduleRebake();
  });
  if (uDepthBias)        fGI.add(params, 'depthBias', 0, 0.5, 0.005).name('Depth bias').onChange(v => uDepthBias.value = v);
  if (uChebyshevFloor)   fGI.add(params, 'chebyshevFloor', 0, 1, 0.01).name('Cheby floor').onChange(v => uChebyshevFloor.value = v);
  fGI.add(params, 'rebakeGI').name('Rebake GI');

  const fLight = gui.addFolder('Light');
  fLight.add(params, 'keyIntensity', 0, 20, 0.05).name('Key intensity').onChange(v => {
    keyLight.intensity = v;
    scheduleRebake();
  });
  fLight.addColor(params, 'keyColor').name('Key color').onChange(v => {
    keyLight.color.set(v);
    scheduleRebake();
  });
  fLight.add(params, 'keyDecay', 0, 3, 0.05).name('Key decay').onChange(v => {
    keyLight.decay = v;
    scheduleRebake();
  });
  fLight.add(params, 'keyHeight', 0.1, 2 * BOX.y - 0.05, 0.01).name('Key height').onChange(v => {
    keyLight.position.y = v;
    scheduleRebake();
  });
  const setPanel = () => uPanelColor.value.set(params.panelR, params.panelG, params.panelB);
  const setPanelAndRebake = () => {
    setPanel();
    scheduleRebake();
  };
  fLight.add(params, 'panelR', 0, 20, 0.05).name('Panel R').onChange(setPanelAndRebake);
  fLight.add(params, 'panelG', 0, 20, 0.05).name('Panel G').onChange(setPanelAndRebake);
  fLight.add(params, 'panelB', 0, 20, 0.05).name('Panel B').onChange(setPanelAndRebake);

  const fWalls = gui.addFolder('Walls');
  fWalls.addColor(params, 'wallRed').name('Red wall').onChange(v => {
    matRed.color.set(v);
    scheduleRebake();
  });
  fWalls.addColor(params, 'wallGreen').name('Green wall').onChange(v => {
    matGreen.color.set(v);
    scheduleRebake();
  });
  fWalls.addColor(params, 'wallWhite').name('White walls').onChange(v => {
    matWhite.color.set(v);
    scheduleRebake();
  });
  fWalls.add(params, 'wallRoughness', 0, 1, 0.01).name('Roughness').onChange(v => {
    matWhite.roughness = v; matRed.roughness = v; matGreen.roughness = v;
    scheduleRebake();
  });
  fWalls.add(params, 'wallMetalness', 0, 1, 0.01).name('Metalness').onChange(v => {
    matWhite.metalness = v; matRed.metalness = v; matGreen.metalness = v;
    scheduleRebake();
  });

  const fView = gui.addFolder('View');
  fView.add(params, 'showProbes').name('Show probes').onChange(v => debugProbeGroup.visible = v);
  fView.add(params, 'boxWireframe').name('Box wireframe').onChange(v => boxWireframes.forEach(w => w.visible = v));
  fView.add(params, 'exposure', 0.2, 2.0, 0.05).name('Exposure').onChange(v => renderer.toneMappingExposure = v);
  debugProbeGroup.visible = params.showProbes;

  bc(`baking probes (${STARTUP_BOUNCES} bounce${DEFAULT_CHEBYSHEV_ENABLED ? ' + depth' : ''})…`);
  await bakeAllProbes(STARTUP_BOUNCES, { captureDepth: DEFAULT_CHEBYSHEV_ENABLED });
  bc('startup bake complete');

  // ---- render loop ----
  const clock = new THREE.Clock();
  let rafId;
  let stopped = false;
  let firstFrame = true;
  async function tick() {
    if (stopped) return;
    const dt = clock.getDelta();
    controls.update();
    try {
      await renderer.renderAsync(scene, camera);
      if (firstFrame) {
        firstFrame = false;
        bc('first renderAsync OK');
      }
    } catch (e) {
      stopped = true;
      console.error('renderAsync failed', e);
      statusEl.classList.add('show');
      statusEl.innerHTML = `<span class="err"><b>Render failed</b><br><span style="font-family:monospace;font-size:11px">${e.message || e}</span></span>`;
      return;
    }
    stats.tick(dt);
    if (!stopped) rafId = requestAnimationFrame(tick);
  }
  bc('starting render loop');
  tick();

  const onResize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', onResize);

  bc('createWebGPUScene done');

  return {
    dispose() {
      stopped = true;
      cancelAnimationFrame(rafId);
      if (rebakeTimer) window.clearTimeout(rebakeTimer);
      window.removeEventListener('resize', onResize);
      gui.destroy();
      controls.dispose();
      probeRadianceRT.forEach(rt => rt.dispose());
      for (const entry of _readbackPool.values()) {
        try { entry.bufferAll.destroy(); } catch (e) { /* already gone */ }
      }
      _readbackPool.clear();
      scene.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          ms.forEach(m => m.dispose());
        }
      });
      renderer.dispose();
    }
  };
}

// ============================================================
// WebGPU raytraced DDGI scene
//
// Probe capture is replaced by a WGSL compute shader that traces 64 rays per
// probe against a three-mesh-bvh BVH, evaluates direct lighting analytically,
// and reads previous-frame SH probes for indirect bounces. A second compute
// pass integrates ray hits into per-probe SH coefficients + depth moments.
//
// This is the engine path: zero rasterized cubemap captures, arbitrary
// triangle meshes, and the same Chebyshev-visibility trilinear-SH fragment
// graph as the existing WebGPU scene (so DDGI sampling math is identical —
// only the probe-update mechanism differs).
// ============================================================
async function createWebGPURTScene(canvas) {
  if (!navigator.gpu) throw new Error('WebGPU not available in this browser.');

  bc('createWebGPURTScene start');

  bc('loading three/webgpu + three/tsl + three-mesh-bvh…');
  const [{ WebGPURenderer, MeshStandardNodeMaterial, MeshBasicNodeMaterial, IrradianceNode, TSL }, bvhMod] =
    await Promise.all([loadWebGPUImports(), import('three-mesh-bvh')]);
  const { MeshBVH } = bvhMod;
  bc('imports loaded');

  const renderer = new WebGPURenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  // 1.3 puts more of the scene in the linear part of the ACES curve so 5%
  // bleed differences become 5% pixel differences (instead of getting
  // compressed to ~1% near the curve's shoulder at exposure 1.0).
  renderer.toneMappingExposure = 1.3;
  await renderer.init();
  bc('renderer init done');

  const device = renderer.backend && renderer.backend.device;
  if (!device) throw new Error('WebGPU device unavailable from renderer backend.');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  class DDGIMeshStandardNodeMaterial extends MeshStandardNodeMaterial {
    constructor(parameters) {
      super(parameters);
      this.ddgiIrradianceNode = null;
    }
    setupLightMap(builder) {
      if (this.ddgiIrradianceNode) return new IrradianceNode(this.ddgiIrradianceNode);
      return super.setupLightMap(builder);
    }
    copy(source) { super.copy(source); this.ddgiIrradianceNode = source.ddgiIrradianceNode; return this; }
  }

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 100);
  camera.position.set(0, 0.95, 3.0);
  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 0.65, 0.05);
  controls.enableDamping = true;
  controls.minDistance = 1.2;
  controls.maxDistance = 8;

  // ---- Simplified Cornell room with explicit material ids ----
  // Material ids are baked into the BVH triangle buffer at build time, so the
  // ray-tracing shader can look up albedo/emissive without hitting a texture.
  // This is the model that scales to a real engine: each draw-call material
  // becomes a slot in a flat Material[] uniform array.
  const MAT_WHITE = 0;
  const MAT_RED   = 1;
  const MAT_GREEN = 2;
  const MAT_BOX   = 3;
  const MAT_PANEL = 4; // emissive

  const matWhite = new DDGIMeshStandardNodeMaterial({ color: 0xeeeeee, roughness: 1.0, metalness: 0.0 });
  const matRed   = new DDGIMeshStandardNodeMaterial({ color: 0xcc2828, roughness: 1.0, metalness: 0.0 });
  const matGreen = new DDGIMeshStandardNodeMaterial({ color: 0x28a828, roughness: 1.0, metalness: 0.0 });
  const matBox   = new DDGIMeshStandardNodeMaterial({ color: 0xeeeeee, roughness: 1.0, metalness: 0.0 });

  const cornell = new THREE.Group();
  scene.add(cornell);

  // Each mesh tags itself with userData.matId so the BVH builder can read it.
  const tagMat = (mesh, id) => { mesh.userData.matId = id; return mesh; };
  const makeQuad = (w, h, m, id) => tagMat(new THREE.Mesh(new THREE.PlaneGeometry(w, h), m), id);

  { const m = makeQuad(2*BOX.x, 2*BOX.z, matWhite, MAT_WHITE); m.rotation.x = -Math.PI/2; cornell.add(m); }
  { const m = makeQuad(2*BOX.x, 2*BOX.z, matWhite, MAT_WHITE); m.rotation.x =  Math.PI/2; m.position.y = 2*BOX.y; cornell.add(m); }
  { const m = makeQuad(2*BOX.x, 2*BOX.y, matWhite, MAT_WHITE); m.position.set(0, BOX.y, -BOX.z); cornell.add(m); }
  // Front wall — rotated 180° so its outward normal points -Z (into the
  // camera). When the user orbits to the back, the camera now sees a wall
  // closing the room instead of the void. The BVH treats it as a normal
  // occluder so it correctly blocks light to/from outside the box.
  { const m = makeQuad(2*BOX.x, 2*BOX.y, matWhite, MAT_WHITE); m.rotation.y = Math.PI; m.position.set(0, BOX.y, BOX.z); cornell.add(m); }
  { const m = makeQuad(2*BOX.z, 2*BOX.y, matRed,   MAT_RED);   m.rotation.y =  Math.PI/2; m.position.set(-BOX.x, BOX.y, 0); cornell.add(m); }
  { const m = makeQuad(2*BOX.z, 2*BOX.y, matGreen, MAT_GREEN); m.rotation.y = -Math.PI/2; m.position.set( BOX.x, BOX.y, 0); cornell.add(m); }

  // Emissive ceiling panel — its triangles will get matId=MAT_PANEL inside the
  // BVH and the RT shader treats them as light sources for direct illumination.
  const lightPanelMat = new MeshBasicNodeMaterial({ color: 0xffffff });
  const uPanelColor = TSL.uniform(new THREE.Vector3(2.5, 2.5, 2.2));
  lightPanelMat.colorNode  = uPanelColor;
  lightPanelMat.toneMapped = false;
  const lightPanel = tagMat(new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.45), lightPanelMat), MAT_PANEL);
  lightPanel.rotation.x = Math.PI/2;
  lightPanel.position.set(0, 2*BOX.y - 0.001, 0);
  cornell.add(lightPanel);

  // Direct point light (analytic in the RT shader — see RT_WGSL below).
  const keyLight = new THREE.PointLight(0xfff8e8, 1.0, 0, 1.0);
  keyLight.position.set(0, 2*BOX.y - 0.05, 0);
  scene.add(keyLight);
  const hemiLight = new THREE.HemisphereLight(0xfff8e8, 0x202028, 0.25);
  hemiLight.position.set(0, 2*BOX.y, 0);
  scene.add(hemiLight);

  const centerBox = tagMat(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.75, 0.75), matBox), MAT_BOX);
  centerBox.position.set(0, 0.375, 0.1);
  centerBox.rotation.y = THREE.MathUtils.degToRad(26);
  cornell.add(centerBox);

  bc('simple RT test room built');

  // ---------- BVH build & serialization ----------
  // Strategy: bake every mesh's vertex data into world space, concatenate into
  // a single indexed BufferGeometry, and run MeshBVH on that. This sidesteps a
  // TLAS for V1 — simpler for a static Cornell test and removes the
  // CPU-per-frame TLAS rebuild a real engine would need. When you start moving
  // objects, swap this for a TLAS+BLAS pipeline; the WGSL traverser only
  // needs to grow an outer-loop and an instance-transform buffer.
  bc('building merged geometry for BVH');
  const collectableMeshes = [];
  cornell.traverse(o => {
    if (o.isMesh && o.userData.matId !== undefined) collectableMeshes.push(o);
  });

  // Worst-case triangle count for sizing typed arrays.
  let totalTriangles = 0;
  for (const m of collectableMeshes) {
    let geom = m.geometry;
    if (geom.index) totalTriangles += geom.index.count / 3;
    else            totalTriangles += geom.attributes.position.count / 3;
  }
  bc(`merging ${collectableMeshes.length} meshes, ${totalTriangles} triangles`);

  const mergedPositions = new Float32Array(totalTriangles * 3 * 3);
  const mergedNormals   = new Float32Array(totalTriangles * 3 * 3);
  const mergedMatIds    = new Uint32Array(totalTriangles);
  let triCursor = 0;
  const tmpV = new THREE.Vector3();
  const tmpN = new THREE.Vector3();
  const normalMat = new THREE.Matrix3();

  for (const m of collectableMeshes) {
    // toNonIndexed() expands indexed -> flat triangle stream; if already
    // non-indexed it's a near no-op clone. Using a single path simplifies the
    // per-vertex loop below.
    const geom = m.geometry.toNonIndexed();
    m.updateWorldMatrix(true, false);
    normalMat.getNormalMatrix(m.matrixWorld);
    const pos = geom.attributes.position;
    const nrm = geom.attributes.normal;
    const triCount = pos.count / 3;
    for (let t = 0; t < triCount; t++) {
      for (let v = 0; v < 3; v++) {
        const srcIdx = t * 3 + v;
        const dstIdx = (triCursor + t) * 9 + v * 3;
        tmpV.fromBufferAttribute(pos, srcIdx).applyMatrix4(m.matrixWorld);
        mergedPositions[dstIdx + 0] = tmpV.x;
        mergedPositions[dstIdx + 1] = tmpV.y;
        mergedPositions[dstIdx + 2] = tmpV.z;
        tmpN.fromBufferAttribute(nrm, srcIdx).applyMatrix3(normalMat).normalize();
        mergedNormals[dstIdx + 0] = tmpN.x;
        mergedNormals[dstIdx + 1] = tmpN.y;
        mergedNormals[dstIdx + 2] = tmpN.z;
      }
      mergedMatIds[triCursor + t] = m.userData.matId;
    }
    triCursor += triCount;
  }
  const TRI_COUNT = triCursor;

  // Build a non-indexed geometry for MeshBVH — it requires an index buffer, so
  // we add a trivial sequential one. (toNonIndexed strips indices; MeshBVH
  // refuses non-indexed input.)
  const bvhGeom = new THREE.BufferGeometry();
  bvhGeom.setAttribute('position', new THREE.BufferAttribute(mergedPositions, 3));
  bvhGeom.setAttribute('normal',   new THREE.BufferAttribute(mergedNormals, 3));
  const seqIndex = new Uint32Array(TRI_COUNT * 3);
  for (let i = 0; i < seqIndex.length; i++) seqIndex[i] = i;
  bvhGeom.setIndex(new THREE.BufferAttribute(seqIndex, 1));

  bc(`building BVH (${TRI_COUNT} tris)`);
  const bvh = new MeshBVH(bvhGeom);
  const serialized = MeshBVH.serialize(bvh, bvhGeom, { copyIndexBuffer: true });
  // serialized.roots: ArrayBuffer[] (one per BVH root — single root for our
  // merged geom). Layout per node (8 u32 words = 32 bytes):
  //   [0..2] boundsMin (vec3 f32)
  //   [3..5] boundsMax (vec3 f32)
  //   [6]    leaf: triIndex offset | internal: right-child u32-offset
  //   [7]    leaf: count|0xFFFF<<16 | internal: split axis (low 16 bits)
  // The high 16 bits of word [7] == 0xFFFF flags a leaf.
  const rootBuffer = serialized.roots[0];
  const nodeWords  = new Uint32Array(rootBuffer);
  const nodeFloats = new Float32Array(rootBuffer);
  const NUM_NODES  = nodeWords.length / 8;
  // serialized.index: triangle index buffer reordered by BVH. Our triangles
  // are stored as 3-vertex groups in mergedPositions/Normals, so a leaf's
  // [offset, offset+count) names *vertex-index triplets* — divide by 3 to get
  // triangle index for the matId lookup.
  const idxBuffer = serialized.index;
  bc(`BVH: ${NUM_NODES} nodes, ${idxBuffer.length} triIdx entries`);

  // ---------- GPU buffers ----------
  // Layout chosen to stay under the 8-storage-buffer-per-stage limit Chrome
  // imposes. We use 6 read-only storage buffers + 2 read/write buffers in the
  // RT pass; 2 read-only + 1 read/write in the integrate pass. Comfortably
  // within budget.
  const RAYS_PER_PROBE = 256;
  const TOTAL_RAYS = PROBE_COUNT * RAYS_PER_PROBE;

  const bvhNodeBuf = device.createBuffer({
    label: 'bvh-nodes',
    size: rootBuffer.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(bvhNodeBuf, 0, rootBuffer);

  const bvhIdxBuf = device.createBuffer({
    label: 'bvh-triidx',
    size: idxBuffer.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(bvhIdxBuf, 0, idxBuffer);

  // Interleaved triangle buffer: pos0, n0, pos1, n1, pos2, n2 (18 floats per
  // triangle), then the matId in a parallel u32 array. Splitting matId out of
  // the float interleave means the WGSL side reads a vec3<f32> directly
  // without bitcasts.
  const TRI_FLOATS_PER = 18;
  const triFloatBuf = new Float32Array(TRI_COUNT * TRI_FLOATS_PER);
  for (let t = 0; t < TRI_COUNT; t++) {
    const dstBase = t * TRI_FLOATS_PER;
    const srcBase = t * 9;
    for (let v = 0; v < 3; v++) {
      triFloatBuf[dstBase + v*6 + 0] = mergedPositions[srcBase + v*3 + 0];
      triFloatBuf[dstBase + v*6 + 1] = mergedPositions[srcBase + v*3 + 1];
      triFloatBuf[dstBase + v*6 + 2] = mergedPositions[srcBase + v*3 + 2];
      triFloatBuf[dstBase + v*6 + 3] = mergedNormals  [srcBase + v*3 + 0];
      triFloatBuf[dstBase + v*6 + 4] = mergedNormals  [srcBase + v*3 + 1];
      triFloatBuf[dstBase + v*6 + 5] = mergedNormals  [srcBase + v*3 + 2];
    }
  }
  const triBuf = device.createBuffer({
    label: 'tri-data',
    size: triFloatBuf.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(triBuf, 0, triFloatBuf);
  const triMatBuf = device.createBuffer({
    label: 'tri-matid',
    size: mergedMatIds.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(triMatBuf, 0, mergedMatIds);

  // Probe positions — one vec4 per probe (xyz + 1 padding float for std430
  // alignment).
  const probePositions = [];
  const probePosBuf32 = new Float32Array(PROBE_COUNT * 4);
  // Home positions: the regular grid lerp'd between PROBE_MIN/MAX. Each probe
  // is allowed to drift up to MAX_PROBE_OFFSET away from its home so trapped
  // probes can escape geometry over a few bakes (DDGI "probe relocation").
  // The trilinear interpolator still uses the home-grid coordinates — the
  // physical position only affects what the probe captures in the RT pass.
  const probeHomePositions = [];
  const probeOffsets = []; // per-probe Vector3 drift from home
  for (let z = 0, i = 0; z < PROBE_DIMS.z; z++)
    for (let y = 0; y < PROBE_DIMS.y; y++)
      for (let x = 0; x < PROBE_DIMS.x; x++, i++) {
        const p = new THREE.Vector3(
          THREE.MathUtils.lerp(PROBE_MIN.x, PROBE_MAX.x, x/(PROBE_DIMS.x-1)),
          THREE.MathUtils.lerp(PROBE_MIN.y, PROBE_MAX.y, y/(PROBE_DIMS.y-1)),
          THREE.MathUtils.lerp(PROBE_MIN.z, PROBE_MAX.z, z/(PROBE_DIMS.z-1))
        );
        probeHomePositions.push(p.clone());
        probeOffsets.push(new THREE.Vector3());
        probePositions.push(p);
        probePosBuf32[i*4 + 0] = p.x;
        probePosBuf32[i*4 + 1] = p.y;
        probePosBuf32[i*4 + 2] = p.z;
        probePosBuf32[i*4 + 3] = 0.0;
      }
  // Cell spacing — half of this is the max allowed drift per axis. Standard
  // DDGI keeps probes inside their original cell so trilinear weights stay
  // valid. We use the *minimum* axis spacing so a probe never crosses a
  // neighbour's home position.
  const PROBE_SPACING_X = (PROBE_MAX.x - PROBE_MIN.x) / (PROBE_DIMS.x - 1);
  const PROBE_SPACING_Y = (PROBE_MAX.y - PROBE_MIN.y) / (PROBE_DIMS.y - 1);
  const PROBE_SPACING_Z = (PROBE_MAX.z - PROBE_MIN.z) / (PROBE_DIMS.z - 1);
  const MAX_PROBE_OFFSET = 0.45 * Math.min(PROBE_SPACING_X, PROBE_SPACING_Y, PROBE_SPACING_Z);
  const RELOCATION_STEP  = 0.6; // 0..1: how much of the suggested move we apply each bake
  const probePosBuf = device.createBuffer({
    label: 'probe-positions',
    size: probePosBuf32.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(probePosBuf, 0, probePosBuf32);

  // Probe debug visualisation — small spheres at each probe location, tinted
  // by their DC ambient (band-0 SH) after each bake. Hidden by default; the
  // GUI exposes a "Show probes" toggle.
  const debugProbeGroup = new THREE.Group();
  debugProbeGroup.visible = false;
  scene.add(debugProbeGroup);
  const debugSpheres = [];
  // Share one geometry across all probes — saves a lot of memory/draw setup
  // for 343 spheres, and they all have identical shape.
  const debugSphereGeo = new THREE.SphereGeometry(0.025, 16, 10);
  for (let i = 0; i < PROBE_COUNT; i++) {
    // toneMapped=false keeps the band-0 tint readable: ACES would otherwise
    // crush near-white probes into pure white (the bright halo effect) and
    // bury low-magnitude tints. Each probe's colour is set in
    // updateDebugProbeColors() from its oct-map band-0 equivalent.
    const mat = new MeshBasicNodeMaterial({ color: 0x808080 });
    mat.toneMapped = false;
    const sphere = new THREE.Mesh(debugSphereGeo, mat);
    sphere.position.copy(probePositions[i]);
    debugProbeGroup.add(sphere);
    debugSpheres.push(sphere);
  }
  // Per-probe "trapped" flag (true = >10% rays hit backfaces, probe is
  // inside or grazing geometry). Filled by the integrate readback in bakeOnce.
  const probeTrappedFlags = new Array(PROBE_COUNT).fill(false);
  // Float (0/1) mirror of probeTrappedFlags shared with the TSL graph so the
  // fragment-shader trilinear loop can downweight a trapped probe's contribution.
  // Forward-declared so the TSL builder (run later) sees the same array.
  let probeTrappedFloatArr = null;
  function readProbeOctBand0Equivalent(idx) {
    const probeX = idx * OCT_RES;
    let sumR = 0.0;
    let sumG = 0.0;
    let sumB = 0.0;
    for (let ty = 0; ty < OCT_RES; ty++) {
      let rowOff = (ty * OCT_TEX_W + probeX) * 4;
      for (let tx = 0; tx < OCT_RES; tx++, rowOff += 4) {
        sumR += probeOctData[rowOff + 0];
        sumG += probeOctData[rowOff + 1];
        sumB += probeOctData[rowOff + 2];
      }
    }
    const invTexels = 1.0 / OCT_TEXELS;
    return [sumR * invTexels, sumG * invTexels, sumB * invTexels];
  }
  function updateDebugProbeColors() {
    // Convert each probe's 8x8 oct map to a band-0-equivalent tint by averaging
