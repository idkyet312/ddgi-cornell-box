    // its texels. The oct layout is roughly equal-solid-angle, so the mean is a
    // stable ambient proxy for debug coloring.
    // Trapped probes (inside geometry) are marked with a magenta tint so
    // they're visually obvious during debugging — their oct map was reseeded
    // from neighbours so the color won't be black even though they would
    // have captured zero radiance themselves.
    // Soft Reinhard (x / (x+1)) on the mean irradiance keeps bright probes
    // from clipping to pure white while preserving the chromatic tint —
    // important now that the debug material has toneMapped=false (so we
    // can't rely on ACES to compress out-of-range values).
    for (let i = 0; i < PROBE_COUNT; i++) {
      if (probeTrappedFlags[i]) {
        debugSpheres[i].material.color.setRGB(1.0, 0.0, 0.6);
      } else {
        const [rMean, gMean, bMean] = readProbeOctBand0Equivalent(i);
        const r = Math.max(0, rMean);
        const g = Math.max(0, gMean);
        const b = Math.max(0, bMean);
        debugSpheres[i].material.color.setRGB(r/(1+r), g/(1+g), b/(1+b));
      }
    }
  }

  // Output: per-ray (radiance.rgb, hitDistance) packed as vec4<f32>. The
  // integrate pass consumes this and produces SH coefficients + depth moments.
  const rayHitsBuf = device.createBuffer({
    label: 'ray-hits',
    size: TOTAL_RAYS * 16,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
  });
  // Debug: stage every probe's rays back to CPU so we can visualize each
  // direction's captured radiance for every probe.
  const debugRayReadBuf = device.createBuffer({
    label: 'debug-ray-readback',
    size: TOTAL_RAYS * 16,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
  });

  // Per-probe octahedral irradiance map: 8×8 = 64 RGBA f32 texels (16 bytes
  // each) per probe. Stored as a flat array of vec4<f32> so we can index it
  // as `probeOct[probeIdx * 64 + texelIdx]` in WGSL. 8×8 matches NVIDIA's
  // RTXGI/DDGI reference defaults — plenty of angular resolution for diffuse
  // GI without ballooning storage. (16×16 would 4× the memory and CPU
  // readback cost; 8×8 hits the sweet spot.)
  const OCT_RES = 8;
  const OCT_TEXELS = OCT_RES * OCT_RES; // 64
  const probeOctBufBytes = PROBE_COUNT * OCT_TEXELS * 16;
  const probeOctBuf = device.createBuffer({
    label: 'probe-oct',
    size: probeOctBufBytes,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
  });
  // Initialise to zero so the first RT pass that reads the cache for indirect
  // bounce lookup sees zero, not garbage.
  device.queue.writeBuffer(probeOctBuf, 0, new Float32Array(probeOctBufBytes / 4));

  const probeDepthBuf = device.createBuffer({
    label: 'probe-depth-moments',
    size: PROBE_COUNT * 16, // vec4: mean, meanSq, _, _
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
  });

  // Staging buffers for readback (created lazily once, reused every bake).
  const probeOctReadBuf = device.createBuffer({
    label: 'probe-oct-readback',
    size: probeOctBufBytes,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
  });
  const probeDepthReadBuf = device.createBuffer({
    label: 'probe-depth-readback',
    size: PROBE_COUNT * 16,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
  });

  // Uniforms: scene-wide RT params (light, panel, materials, frame state).
  // Layout (vec4-aligned):
  //   keyPos.xyz, keyIntensity                   (vec4)
  //   keyColor.rgb, _pad                         (vec4)
  //   panelEmission.rgb, _pad                    (vec4)
  //   probeMin.xyz, _pad                         (vec4)
  //   probeMax.xyz, _pad                         (vec4)
  //   probeDims.xyz, raysPerProbe (as float)     (vec4)
  //   numNodes, numTris, frameSeed, indirectScale (vec4 / mixed)
  //   materials[8]: vec4 albedo, vec4 emissive   (16 floats per slot)
  const NUM_MATERIAL_SLOTS = 8;
  const RT_UNIFORM_VEC4S = 7 + NUM_MATERIAL_SLOTS * 2;
  const rtUniBuf32 = new Float32Array(RT_UNIFORM_VEC4S * 4);
  const rtUniBuf = device.createBuffer({
    label: 'rt-uniforms',
    size: rtUniBuf32.byteLength,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  function packRTUniforms(frameSeed, indirectScale) {
    const u = rtUniBuf32;
    u[0]  = keyLight.position.x; u[1]  = keyLight.position.y; u[2]  = keyLight.position.z;
    u[3]  = keyLight.intensity;
    u[4]  = keyLight.color.r;    u[5]  = keyLight.color.g;    u[6]  = keyLight.color.b; u[7] = 0;
    u[8]  = uPanelColor.value.x; u[9]  = uPanelColor.value.y; u[10] = uPanelColor.value.z; u[11] = 0;
    u[12] = PROBE_MIN.x; u[13] = PROBE_MIN.y; u[14] = PROBE_MIN.z; u[15] = 0;
    u[16] = PROBE_MAX.x; u[17] = PROBE_MAX.y; u[18] = PROBE_MAX.z; u[19] = 0;
    u[20] = PROBE_DIMS.x; u[21] = PROBE_DIMS.y; u[22] = PROBE_DIMS.z; u[23] = RAYS_PER_PROBE;
    u[24] = NUM_NODES; u[25] = TRI_COUNT; u[26] = frameSeed; u[27] = indirectScale;
    // materials — WGSL struct has two separate arrays:
    //   matAlbedo[8]   at floats 28..59  (8 vec4 = 32 floats)
    //   matEmissive[8] at floats 60..91
    // Earlier code wrote them interleaved as if it were array-of-struct, which
    // mis-aligned every material slot past 0 and made the green wall read the
    // red albedo slot. Write into the matching struct-of-arrays layout now.
    const writeMat = (slot, r, g, b, er, eg, eb) => {
      const albOff = 28 + slot * 4;
      const emOff  = 60 + slot * 4;
      u[albOff+0]=r;  u[albOff+1]=g;  u[albOff+2]=b;  u[albOff+3]=0;
      u[emOff+0]=er;  u[emOff+1]=eg;  u[emOff+2]=eb;  u[emOff+3]=0;
    };
    writeMat(MAT_WHITE, matWhite.color.r, matWhite.color.g, matWhite.color.b, 0,0,0);
    writeMat(MAT_RED,   matRed.color.r,   matRed.color.g,   matRed.color.b,   0,0,0);
    writeMat(MAT_GREEN, matGreen.color.r, matGreen.color.g, matGreen.color.b, 0,0,0);
    writeMat(MAT_BOX,   matBox.color.r,   matBox.color.g,   matBox.color.b,   0,0,0);
    writeMat(MAT_PANEL, 0, 0, 0, uPanelColor.value.x, uPanelColor.value.y, uPanelColor.value.z);
    device.queue.writeBuffer(rtUniBuf, 0, u);
  }

  // ---------- WGSL shaders ----------
  const RT_WGSL = /* wgsl */`
struct RTUniforms {
  keyPosI:    vec4<f32>,    // xyz=pos, w=intensity
  keyColor:   vec4<f32>,    // rgb=color, w=_
  panelEmit:  vec4<f32>,    // rgb=emission, w=_
  probeMin:   vec4<f32>,
  probeMax:   vec4<f32>,
  probeDimsR: vec4<f32>,    // xyz=dims, w=raysPerProbe
  rtMeta:     vec4<f32>,    // x=numNodes, y=numTris, z=frameSeed, w=indirectScale
  matAlbedo:  array<vec4<f32>, 8>,
  matEmissive:array<vec4<f32>, 8>,
};
@group(0) @binding(0) var<uniform> U: RTUniforms;
@group(0) @binding(1) var<storage, read> bvhNodes: array<u32>;       // 8 u32 per node
@group(0) @binding(2) var<storage, read> bvhTriIdx: array<u32>;
@group(0) @binding(3) var<storage, read> triData:   array<f32>;      // 18 f32 per tri
@group(0) @binding(4) var<storage, read> triMatId:  array<u32>;
@group(0) @binding(5) var<storage, read> probePos:  array<vec4<f32>>;
@group(0) @binding(6) var<storage, read> probeOctIn: array<vec4<f32>>; // 64 vec4 per probe (8x8 oct map)
@group(0) @binding(7) var<storage, read_write> rayHits: array<vec4<f32>>;

const PI : f32 = 3.14159265358979;

fn nodeBoundsMin(nodeI: u32) -> vec3<f32> {
  let b = nodeI * 8u;
  return vec3<f32>(bitcast<f32>(bvhNodes[b]), bitcast<f32>(bvhNodes[b+1u]), bitcast<f32>(bvhNodes[b+2u]));
}
fn nodeBoundsMax(nodeI: u32) -> vec3<f32> {
  let b = nodeI * 8u;
  return vec3<f32>(bitcast<f32>(bvhNodes[b+3u]), bitcast<f32>(bvhNodes[b+4u]), bitcast<f32>(bvhNodes[b+5u]));
}
fn nodeIsLeaf(nodeI: u32) -> bool {
  let b = nodeI * 8u;
  // word [7]: leaf flag in high 16 bits == 0xFFFF
  return ((bvhNodes[b+7u] >> 16u) & 0xFFFFu) == 0xFFFFu;
}
fn nodeOffset(nodeI: u32) -> u32 { return bvhNodes[nodeI * 8u + 6u]; }
fn nodeCount(nodeI: u32)  -> u32 { return bvhNodes[nodeI * 8u + 7u] & 0xFFFFu; }
fn nodeRight(nodeI: u32)  -> u32 { return bvhNodes[nodeI * 8u + 6u] / 8u; } // u32 offset / words-per-node = node index

// Branchless ray-AABB slab test. Returns true and tNear/tFar on hit.
fn rayAabb(ro: vec3<f32>, invRd: vec3<f32>, bMin: vec3<f32>, bMax: vec3<f32>, tMaxIn: f32) -> vec2<f32> {
  let t1 = (bMin - ro) * invRd;
  let t2 = (bMax - ro) * invRd;
  let tMin = min(t1, t2);
  let tMax = max(t1, t2);
  let tNear = max(max(tMin.x, tMin.y), tMin.z);
  let tFar  = min(min(tMax.x, tMax.y), min(tMax.z, tMaxIn));
  return vec2<f32>(tNear, tFar);
}

struct TriHit { t: f32, u: f32, v: f32 };

fn rayTri(ro: vec3<f32>, rd: vec3<f32>, v0: vec3<f32>, v1: vec3<f32>, v2: vec3<f32>) -> TriHit {
  // Möller–Trumbore. Returns t = -1 on miss.
  let e1 = v1 - v0;
  let e2 = v2 - v0;
  let pv = cross(rd, e2);
  let det = dot(e1, pv);
  var hit: TriHit;
  hit.t = -1.0; hit.u = 0.0; hit.v = 0.0;
  if (abs(det) < 1e-8) { return hit; }
  let invDet = 1.0 / det;
  let tv = ro - v0;
  let u = dot(tv, pv) * invDet;
  if (u < 0.0 || u > 1.0) { return hit; }
  let qv = cross(tv, e1);
  let v = dot(rd, qv) * invDet;
  if (v < 0.0 || u + v > 1.0) { return hit; }
  let t = dot(e2, qv) * invDet;
  if (t < 1e-4) { return hit; }
  hit.t = t; hit.u = u; hit.v = v;
  return hit;
}

struct SceneHit {
  hit: bool,
  t: f32,
  pos: vec3<f32>,
  nrm: vec3<f32>,
  matId: u32,
};

fn traceScene(roIn: vec3<f32>, rd: vec3<f32>, tMaxIn: f32) -> SceneHit {
  var result: SceneHit;
  result.hit = false; result.t = tMaxIn;
  result.pos = vec3<f32>(0.0); result.nrm = vec3<f32>(0.0); result.matId = 0u;

  // Guard against zero components on axis-aligned rays — slab test handles
  // resulting +inf cleanly, but we'd rather not feed NaN into min/max.
  let safeRdX = select(rd.x, 1e-20, abs(rd.x) < 1e-20);
  let safeRdY = select(rd.y, 1e-20, abs(rd.y) < 1e-20);
  let safeRdZ = select(rd.z, 1e-20, abs(rd.z) < 1e-20);
  let invRd = vec3<f32>(1.0 / safeRdX, 1.0 / safeRdY, 1.0 / safeRdZ);
  // Stack of node indices to visit. Depth ~24 covers a 16-leaf BVH; we cap at
  // 32 to match WGSL function-local-bytes budgets on mobile drivers.
  var stack: array<u32, 32>;
  var sp: i32 = 0;
  stack[0] = 0u;
  sp = 1;

  loop {
    if (sp == 0) { break; }
    sp = sp - 1;
    let nodeI = stack[sp];

    let aabb = rayAabb(roIn, invRd, nodeBoundsMin(nodeI), nodeBoundsMax(nodeI), result.t);
    if (aabb.x > aabb.y || aabb.x > result.t) { continue; }

    if (nodeIsLeaf(nodeI)) {
      let off = nodeOffset(nodeI);   // offset in *triangles*
      let cnt = nodeCount(nodeI);    // count in *triangles*
      let vertOff = off * 3u;        // multiplied to index into bvhTriIdx
      for (var i: u32 = 0u; i < cnt; i = i + 1u) {
        // Each triangle = 3 consecutive vertex indices in bvhTriIdx; since the
        // source geometry was non-indexed (sequential vert ids), all 3 indices
        // for a tri map to the same triangle slot in our packed triData. We
        // read just the first.
        let triId = bvhTriIdx[vertOff + i * 3u] / 3u;
        let base = triId * 18u;
        let v0 = vec3<f32>(triData[base+0u],  triData[base+1u],  triData[base+2u]);
        let v1 = vec3<f32>(triData[base+6u],  triData[base+7u],  triData[base+8u]);
        let v2 = vec3<f32>(triData[base+12u], triData[base+13u], triData[base+14u]);
        let h = rayTri(roIn, rd, v0, v1, v2);
        if (h.t > 0.0 && h.t < result.t) {
          result.hit = true;
          result.t = h.t;
          result.pos = roIn + rd * h.t;
          let n0 = vec3<f32>(triData[base+3u],  triData[base+4u],  triData[base+5u]);
          let n1 = vec3<f32>(triData[base+9u],  triData[base+10u], triData[base+11u]);
          let n2 = vec3<f32>(triData[base+15u], triData[base+16u], triData[base+17u]);
          let w = 1.0 - h.u - h.v;
          result.nrm = normalize(n0 * w + n1 * h.u + n2 * h.v);
          result.matId = triMatId[triId];
        }
      }
    } else {
      // Push both children. Order doesn't matter for a closest-hit query but
      // pushing the further one first means we pop the nearer one first — a
      // small but real perf win on imbalanced trees. Skip the heuristic for V1.
      if (sp < 30) {
        stack[sp] = nodeI + 1u;        // left = next node in buffer
        sp = sp + 1;
        stack[sp] = nodeRight(nodeI);
        sp = sp + 1;
      }
    }
  }
  return result;
}

// Visibility test for direct lighting. Same traversal but stops on first hit.
fn occluded(ro: vec3<f32>, rd: vec3<f32>, tMax: f32) -> bool {
  // Guard against zero components on axis-aligned rays — slab test handles
  // resulting +inf cleanly, but we'd rather not feed NaN into min/max.
  let safeRdX = select(rd.x, 1e-20, abs(rd.x) < 1e-20);
  let safeRdY = select(rd.y, 1e-20, abs(rd.y) < 1e-20);
  let safeRdZ = select(rd.z, 1e-20, abs(rd.z) < 1e-20);
  let invRd = vec3<f32>(1.0 / safeRdX, 1.0 / safeRdY, 1.0 / safeRdZ);
  var stack: array<u32, 32>;
  var sp: i32 = 0;
  stack[0] = 0u;
  sp = 1;
  loop {
    if (sp == 0) { break; }
    sp = sp - 1;
    let nodeI = stack[sp];
    let aabb = rayAabb(ro, invRd, nodeBoundsMin(nodeI), nodeBoundsMax(nodeI), tMax);
    if (aabb.x > aabb.y) { continue; }
    if (nodeIsLeaf(nodeI)) {
      let off = nodeOffset(nodeI);
      let cnt = nodeCount(nodeI);
      let vertOff = off * 3u;
      for (var i: u32 = 0u; i < cnt; i = i + 1u) {
        let triId = bvhTriIdx[vertOff + i * 3u] / 3u;
        let base = triId * 18u;
        let v0 = vec3<f32>(triData[base+0u],  triData[base+1u],  triData[base+2u]);
        let v1 = vec3<f32>(triData[base+6u],  triData[base+7u],  triData[base+8u]);
        let v2 = vec3<f32>(triData[base+12u], triData[base+13u], triData[base+14u]);
        let h = rayTri(ro, rd, v0, v1, v2);
        if (h.t > 0.0 && h.t < tMax) { return true; }
      }
    } else {
      if (sp < 30) {
        stack[sp] = nodeI + 1u; sp = sp + 1;
        stack[sp] = nodeRight(nodeI); sp = sp + 1;
      }
    }
  }
  return false;
}

// Octahedral encoding — maps a unit direction to a unit-square UV. Standard
// formulation from "A Survey of Efficient Representations for Independent
// Unit Vectors" (Cigolle et al, 2014). Used by DDGI to flatten each probe's
// hemisphere into an 8×8 image where each texel = irradiance from a roughly
// equal solid angle.
fn octEncode(n_in: vec3<f32>) -> vec2<f32> {
  let n = n_in / (abs(n_in.x) + abs(n_in.y) + abs(n_in.z));
  var uv = vec2<f32>(n.x, n.y);
  if (n.z < 0.0) {
    let s = vec2<f32>(select(-1.0, 1.0, uv.x >= 0.0),
                      select(-1.0, 1.0, uv.y >= 0.0));
    uv = (1.0 - abs(vec2<f32>(uv.y, uv.x))) * s;
  }
  return uv * 0.5 + 0.5; // 0..1
}

const OCT_RES_F: f32 = 8.0;
const OCT_TEX:   u32 = 64u;

// Read the (possibly bilinear-filtered) irradiance from a single probe's
// 8×8 oct map, given a direction n.
fn sampleProbeOct(probeIdx: u32, n: vec3<f32>) -> vec3<f32> {
  let uv = octEncode(n) * OCT_RES_F - 0.5;
  let base = probeIdx * OCT_TEX;
  let x0 = clamp(i32(floor(uv.x)), 0, 7);
  let y0 = clamp(i32(floor(uv.y)), 0, 7);
  let x1 = min(x0 + 1, 7);
  let y1 = min(y0 + 1, 7);
  let fx = clamp(uv.x - f32(x0), 0.0, 1.0);
  let fy = clamp(uv.y - f32(y0), 0.0, 1.0);
  let i00 = base + u32(y0 * 8 + x0);
  let i10 = base + u32(y0 * 8 + x1);
  let i01 = base + u32(y1 * 8 + x0);
  let i11 = base + u32(y1 * 8 + x1);
  let c00 = probeOctIn[i00].xyz;
  let c10 = probeOctIn[i10].xyz;
  let c01 = probeOctIn[i01].xyz;
  let c11 = probeOctIn[i11].xyz;
  let cx0 = mix(c00, c10, fx);
  let cx1 = mix(c01, c11, fx);
  return mix(cx0, cx1, fy);
}

// Sample previous-frame irradiance at a world-space point — this is what
// gives DDGI its infinite-bounce property. Trilinear over the 8 nearest
// probes, no Chebyshev (the fragment shader does that for the camera's POV;
// here we just want a smooth radiance cache for indirect bounces).
fn sampleProbeGridOct(p: vec3<f32>, n: vec3<f32>) -> vec3<f32> {
  let dims = U.probeDimsR.xyz;
  let pmin = U.probeMin.xyz;
  let pmax = U.probeMax.xyz;
  let grid = clamp((p - pmin) / (pmax - pmin), vec3<f32>(0.0), vec3<f32>(1.0)) * (dims - vec3<f32>(1.0));
  let baseI = floor(min(grid, dims - vec3<f32>(1.0001)));
  let frac = clamp(grid - baseI, vec3<f32>(0.0), vec3<f32>(1.0));
  let Dx = u32(dims.x);
  let Dy = u32(dims.y);
  var sum = vec3<f32>(0.0);
  var wSum = 0.0;
  for (var cz: i32 = 0; cz < 2; cz = cz + 1) {
    for (var cy: i32 = 0; cy < 2; cy = cy + 1) {
      for (var cx: i32 = 0; cx < 2; cx = cx + 1) {
        let ix = u32(baseI.x) + u32(cx);
        let iy = u32(baseI.y) + u32(cy);
        let iz = u32(baseI.z) + u32(cz);
        let tx = select(1.0 - frac.x, frac.x, cx == 1);
        let ty = select(1.0 - frac.y, frac.y, cy == 1);
        let tz = select(1.0 - frac.z, frac.z, cz == 1);
        let w = max(tx * ty * tz, 1e-5);
        let idx = iz * Dx * Dy + iy * Dx + ix;
        sum = sum + max(sampleProbeOct(idx, n), vec3<f32>(0.0)) * w;
        wSum = wSum + w;
      }
    }
  }
  return sum / max(wSum, 1e-4);
}

// Cheap deterministic hash → uniform float — used for per-ray jitter.
fn hash11(x: u32) -> f32 {
  var n = x ^ (x >> 16u);
  n = n * 0x21f0aaadu;
  n = n ^ (n >> 15u);
  n = n * 0x735a2d97u;
  n = n ^ (n >> 15u);
  return f32(n) / f32(0xffffffffu);
}

// Fibonacci sphere direction. cosTheta uses *only* rayI (so it walks evenly
// from +1 to -1 across the ray batch). The seed perturbs *only* the azimuth
// — rotating the spiral around the pole — which preserves the uniform sphere
// distribution while still giving per-probe / per-frame variation. The old
// version added seed into cosTheta, which pushed it far outside [-1,1] for
// large probe indices and collapsed all rays to a single direction.
fn fibSphere(rayI: u32, total: u32, seed: f32) -> vec3<f32> {
  let golden = 0.5 * (sqrt(5.0) - 1.0);
  let i = f32(rayI) + 0.5;
  let phi = 2.0 * PI * fract(i * golden + seed * golden);
  let cosTheta = 1.0 - 2.0 * (i / f32(total));
  let sinTheta = sqrt(max(0.0, 1.0 - cosTheta * cosTheta));
  return vec3<f32>(cos(phi) * sinTheta, sin(phi) * sinTheta, cosTheta);
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let rayId = gid.x;

  if (rayId >= totalRays) { return; }
  let raysPer = u32(U.probeDimsR.w);
  let probeIdx = rayId / raysPer;
  let inProbe  = rayId - probeIdx * raysPer;

  let ro = probePos[probeIdx].xyz;
  let rd = fibSphere(inProbe, raysPer, U.rtMeta.z + f32(probeIdx) * 0.61803);

  let h = traceScene(ro, rd, 50.0);
  var radiance = vec3<f32>(0.0);
  var hitDist = 50.0;
  // Backface flag: a ray hitting the *inside* of a triangle (dot(rd, n) > 0)
  // means this part of the probe's hemisphere is buried in geometry. We
  // encode the flag in the sign of hitDist so the integrate pass can count
  // backfaces without an extra storage buffer (saves a binding slot).
  var backface = false;
  if (h.hit) {
    hitDist = h.t;
    backface = dot(rd, h.nrm) > 0.0;
    let albedo = U.matAlbedo[h.matId].xyz;
    // Tonemap the emissive before it enters SH projection. The light panel
    // emits at HDR levels (~8.0) but SH band-1/2 cannot represent a single
    // bright direction without producing visible negative-lobe rings on
    // surfaces near the source. Aggressive Reinhard (k=0.8) maps a panel
    // emission of 8 down to ~1.2, which is well within band-2's faithful
    // representation range while still letting the panel dominate the DC
    // ambient of nearby probes (which is what drives bounce intensity).
    // The fragment shader still receives the full HDR panel emission via
    // the lightPanel mesh, so the *visible* panel is unaffected.
    let emissive = U.matEmissive[h.matId].xyz;
    let compressedE = emissive / (vec3<f32>(1.0) + emissive * 0.8);
    radiance = compressedE;

    // Direct lighting: point light (analytic, with shadow-ray test).
    let toLight = U.keyPosI.xyz - h.pos;
    let lDist = length(toLight);
    let lDir = toLight / max(lDist, 1e-6);
    let nDotL = max(dot(h.nrm, lDir), 0.0);
    if (nDotL > 0.0) {
      // Bias the shadow origin along the surface normal to avoid self-hit.
      let shadowOrigin = h.pos + h.nrm * 1e-3;
      if (!occluded(shadowOrigin, lDir, lDist - 1e-3)) {
        // Inverse-square attenuation matches three.js PointLight with decay=1
        // (one-over-distance-squared in linear space).
        let atten = 1.0 / max(lDist * lDist, 1e-4);
        radiance = radiance + albedo * (U.keyColor.xyz * U.keyPosI.w * nDotL * atten / PI);
      }
    }

    // Indirect: sample the probe-grid SH at the hit point. Clip negatives
    // (SH ringing artifact, not real radiance) but allow positive bounces to
    // accumulate — capping here would prevent multi-bounce from reaching
    // steady-state where colored walls saturate enough to bleed visibly.
    // The per-ray total radiance clamp below (line ~2160) is the safety net.
    let indirect = max(sampleProbeGridOct(h.pos, h.nrm), vec3<f32>(0.0));
    radiance = radiance + albedo * indirect * U.rtMeta.w / PI;
  }

  // normalized (no double-cosBand). The panel hits compress to ~1.6 via
  // emissive Reinhard above, walls reflect ~0.05–0.5, so 3.0 leaves
  // headroom while still bounding pathological spikes.
  radiance = min(radiance, vec3<f32>(3.0));
  // Encode backface as negative distance. Integrate pass: dist < 0 means
  // backface, abs(dist) is the actual hit distance.
  let signedDist = select(hitDist, -hitDist, backface);
  rayHits[rayId] = vec4<f32>(radiance, signedDist);
}

struct IntUniforms {
  raysPerProbe: u32,
  numProbes: u32,
  depthRange: f32,
  frameSeed: f32, // must match RT pass — directions are seed-deterministic
};
@group(0) @binding(0) var<uniform> U: IntUniforms;
@group(0) @binding(1) var<storage, read> rayHits: array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> probeOct: array<vec4<f32>>;    // 64 vec4/probe (8x8)
@group(0) @binding(3) var<storage, read_write> probeDepth: array<vec4<f32>>;  // mean,meanSq,_,trapped

const PI: f32 = 3.14159265358979;
const OCT_RES: u32 = 8u;
const OCT_TEX: u32 = 64u;

fn fibSphere(rayI: u32, total: u32, seed: f32) -> vec3<f32> {
  let golden = 0.5 * (sqrt(5.0) - 1.0);
  let i = f32(rayI) + 0.5;
  let phi = 2.0 * PI * fract(i * golden + seed * golden);
  let cosTheta = 1.0 - 2.0 * (i / f32(total));
  let sinTheta = sqrt(max(0.0, 1.0 - cosTheta * cosTheta));
  return vec3<f32>(cos(phi) * sinTheta, sin(phi) * sinTheta, cosTheta);
}

// Octahedral decode: (texelX, texelY) in [0..7] -> world unit direction.
// Center of texel n is at (n+0.5)/OCT_RES in [0..1]; map to [-1..1] then
// inverse the octahedral fold.
fn octDirFromTexel(tx: u32, ty: u32) -> vec3<f32> {
  let uv = (vec2<f32>(f32(tx), f32(ty)) + 0.5) / f32(OCT_RES);
  let p  = uv * 2.0 - 1.0;
  var n = vec3<f32>(p.x, p.y, 1.0 - abs(p.x) - abs(p.y));
  if (n.z < 0.0) {
    let t = vec2<f32>(n.x, n.y);
    n.x = (1.0 - abs(t.y)) * select(-1.0, 1.0, t.x >= 0.0);
    n.y = (1.0 - abs(t.x)) * select(-1.0, 1.0, t.y >= 0.0);

  return normalize(n);
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {

  if (probeIdx >= U.numProbes) { return; }
  let raysPer = U.raysPerProbe;

  // store ray directions / radiance here — they're already in rayHits and
  // we re-derive directions from fibSphere in the texel loop.
  var depthSum = 0.0;
  var depthSumSq = 0.0;
  var backfaceCount: u32 = 0u;
  for (var i: u32 = 0u; i < raysPer; i = i + 1u) {
    let hit = rayHits[probeIdx * raysPer + i];
    let signedDist = hit.w;
    let dist = min(abs(signedDist), U.depthRange);
    if (signedDist < 0.0) { backfaceCount = backfaceCount + 1u; }
    depthSum   = depthSum   + dist;
    depthSumSq = depthSumSq + dist * dist;
  }
  // 2% threshold: any probe with even a few backface rays is grazing/inside
  // geometry and its directional bins would be unreliable. Mark trapped.
  let backfaceRatio = f32(backfaceCount) / f32(raysPer);
  let trapped = backfaceRatio > 0.02;

  let meanD   = clamp(depthSum   / f32(raysPer), 0.0, U.depthRange);
  let meanDSq = max(meanD * meanD, clamp(depthSumSq / f32(raysPer), 0.0, U.depthRange * U.depthRange));
  probeDepth[probeIdx] = vec4<f32>(meanD, meanDSq, 0.0, select(0.0, 1.0, trapped));

  // Second pass: for each of the 64 oct texels, compute the cosine-weighted
  // sum of all rays (skipping backfaces) and write to the oct map. The
  // cosine kernel is centred on the texel's world direction, so each texel
  // is an independent irradiance estimate for that direction. With 256 rays
  // and 64 texels, every texel sees on average 128 rays in its hemisphere
  // (cos > 0), which is plenty for a smooth result.
  let raySeed = U.frameSeed;
  for (var ty: u32 = 0u; ty < OCT_RES; ty = ty + 1u) {
    for (var tx: u32 = 0u; tx < OCT_RES; tx = tx + 1u) {

      if (trapped) {

        let rd = fibSphere(i, raysPer, raySeed + f32(probeIdx) * 0.61803);

      let clamped = clamp(irr, vec3<f32>(0.0), vec3<f32>(8.0));
      probeOct[outIdx] = vec4<f32>(clamped, 0.0);
    }
  }
}

struct SeedUniforms {
  dims: vec4<u32>,    // xyz=probe dims, w=numProbes
};
@group(0) @binding(0) var<uniform> U: SeedUniforms;
@group(0) @binding(1) var<storage, read_write> probeOct:   array<vec4<f32>>;  // 64 vec4/probe
@group(0) @binding(2) var<storage, read>       probeDepth: array<vec4<f32>>;

const OCT_TEX: u32 = 64u;

fn flatIdx(x: i32, y: i32, z: i32) -> i32 {
  let dx = i32(U.dims.x);
  let dy = i32(U.dims.y);
  return z * dx * dy + y * dx + x;
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let probeIdx = gid.x;
  if (probeIdx >= U.dims.w) { return; }
  let trapped = probeDepth[probeIdx].w > 0.5;
  if (!trapped) { return; }

  let dx = i32(U.dims.x);
  let dy = i32(U.dims.y);
  let dz = i32(U.dims.z);
  let z = i32(probeIdx) / (dx * dy);
  let y = (i32(probeIdx) - z * dx * dy) / dx;
  let x = i32(probeIdx) - z * dx * dy - y * dx;

  let off = array<vec3<i32>, 6>(
    vec3<i32>(-1, 0, 0), vec3<i32>(1, 0, 0),
    vec3<i32>(0, -1, 0), vec3<i32>(0, 1, 0),
    vec3<i32>(0, 0, -1), vec3<i32>(0, 0, 1)
  );

  // For each oct texel, average the same texel from up to 6 healthy neighbours.
  for (var t: u32 = 0u; t < OCT_TEX; t = t + 1u) {
    var sum = vec3<f32>(0.0);
    var count = 0.0;
    for (var i: u32 = 0u; i < 6u; i = i + 1u) {
      let o = off[i];
      let nx = x + o.x;
      let ny = y + o.y;
      let nz = z + o.z;
      if (nx < 0 || nx >= dx) { continue; }
      if (ny < 0 || ny >= dy) { continue; }
      if (nz < 0 || nz >= dz) { continue; }
      let nIdx = flatIdx(nx, ny, nz);
      if (probeDepth[nIdx].w > 0.5) { continue; }
      sum = sum + probeOct[u32(nIdx) * OCT_TEX + t].xyz;
      count = count + 1.0;
    }
    if (count > 0.0) {
      probeOct[probeIdx * OCT_TEX + t] = vec4<f32>(sum / count, 0.0);
    }
  }
}

    entries: [
      { binding: 0, resource: { buffer: rtUniBuf } },
      { binding: 1, resource: { buffer: bvhNodeBuf } },
      { binding: 2, resource: { buffer: bvhIdxBuf } },
      { binding: 3, resource: { buffer: triBuf } },
      { binding: 4, resource: { buffer: triMatBuf } },
      { binding: 5, resource: { buffer: probePosBuf } },
      { binding: 6, resource: { buffer: probeOctBuf } },
      { binding: 7, resource: { buffer: rayHitsBuf } },
    ],
  });

  const WEBGPU_DEPTH_RANGE = 50;
  const intUniBuf = device.createBuffer({
    label: 'integrate-uniforms',
    size: 16,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  const intUniArr = new ArrayBuffer(16);
  const intUniDV = new DataView(intUniArr);
  function writeIntegrateUniforms(seed) {
    intUniDV.setUint32(0, RAYS_PER_PROBE, true);
    intUniDV.setUint32(4, PROBE_COUNT, true);
    intUniDV.setFloat32(8, WEBGPU_DEPTH_RANGE, true);
    intUniDV.setFloat32(12, seed, true);
    device.queue.writeBuffer(intUniBuf, 0, intUniArr);
  }
  writeIntegrateUniforms(0);

  const intBindGroup = device.createBindGroup({
    layout: intPipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: intUniBuf } },
      { binding: 1, resource: { buffer: rayHitsBuf } },
      { binding: 2, resource: { buffer: probeOctBuf } },
      { binding: 3, resource: { buffer: probeDepthBuf } },
    ],
  });

  const seedBindGroup = device.createBindGroup({
    layout: seedPipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: seedUniBuf } },
      { binding: 1, resource: { buffer: probeOctBuf } },
      { binding: 2, resource: { buffer: probeDepthBuf } },
    ],
  });

  // ---------- TSL fragment graph (octahedral 8×8 per probe) ----------
  // Each probe's irradiance lives in an 8×8 RGBA-float texel block. We pack
  // all PROBE_COUNT blocks horizontally into a single 2D DataTexture of size
  // (PROBE_COUNT * 8, 8). Blob k is at columns [k*8 .. k*8+8). Probe lookup
  // = sample 4 texels manually for bilinear within the probe's tile (a real
  // bilinear sampler would bleed across probe tile boundaries).
  const OCT_TEX_W = PROBE_COUNT * OCT_RES; // 2744 for 343 probes
  const OCT_TEX_H = OCT_RES;                // 8
  const probeOctData = new Float32Array(OCT_TEX_W * OCT_TEX_H * 4);
  const probeOctTex = new THREE.DataTexture(probeOctData, OCT_TEX_W, OCT_TEX_H, THREE.RGBAFormat, THREE.FloatType);
  probeOctTex.minFilter = THREE.NearestFilter;
  probeOctTex.magFilter = THREE.NearestFilter;
  probeOctTex.wrapS = THREE.ClampToEdgeWrapping;
  probeOctTex.wrapT = THREE.ClampToEdgeWrapping;
  probeOctTex.needsUpdate = true;

  const probeDepthMeanArr   = new Array(PROBE_COUNT).fill(100.0);
  const probeDepthMeanSqArr = new Array(PROBE_COUNT).fill(10000.0);

  let uGiMode, uGiEnabled, uGiIntensity, uGiPiFactor, uGiTransportMode;
  let uProbeMin, uProbeMax, uProbeDims;
  let uChebyshevEnabled, uDepthBias, uChebyshevFloor;
  bc('building TSL GI graph');
  try {
    const { Fn, vec3, vec2, float, int, uniform, uniformArray, texture, positionWorld, normalWorld } = TSL;
    uProbeMin    = uniform(PROBE_MIN.clone());
    uProbeMax    = uniform(PROBE_MAX.clone());
    uProbeDims   = uniform(PROBE_DIMS.clone());
    // Default 2.0: ACES tonemapping at exposure 1.3 compresses small bleed
    // contributions (typically 0.05–0.2) below visible-difference threshold
    // when direct light is at ~1.0. Doubling the multiplier puts colored
    // bleed above the noise floor of the tonemap curve.
    uGiIntensity = uniform(2.0);
    uGiEnabled   = uniform(1.0);
    uGiMode      = uniform(5.0);
    uGiPiFactor  = uniform(1.0);
    uGiTransportMode = uniform(2);

    const uOctTex       = texture(probeOctTex);
    const uDepthMean    = uniformArray(probeDepthMeanArr, 'float');
    const uDepthMeanSq  = uniformArray(probeDepthMeanSqArr, 'float');
    probeTrappedFloatArr = new Array(PROBE_COUNT).fill(0.0);
    const uProbeTrapped = uniformArray(probeTrappedFloatArr, 'float');
    uChebyshevEnabled   = uniform(1.0);
    uDepthBias          = uniform(0.12);
    uChebyshevFloor     = uniform(0.0);

    const TEX_W = float(OCT_TEX_W);
    const TEX_H = float(OCT_TEX_H);
    const OCT_F = float(OCT_RES);

    // Octahedral encode: unit direction -> [0..1]^2 within a single probe tile.
    const octEncode = (n) => {
      const an = n.abs();
      const sum = an.x.add(an.y).add(an.z).max(float(1e-6));
      const p   = vec2(n.x.div(sum), n.y.div(sum));
      // If z<0 fold to corners (matches WGSL octEncode used in the bake).
      const folded = vec2(
        float(1.0).sub(p.y.abs()).mul(p.x.greaterThanEqual(float(0.0)).mix(float(-1.0), float(1.0)).negate()),
        float(1.0).sub(p.x.abs()).mul(p.y.greaterThanEqual(float(0.0)).mix(float(-1.0), float(1.0)).negate())
      );
      const uv = n.z.lessThan(float(0.0)).mix(p, folded);
      return uv.mul(0.5).add(0.5); // 0..1
    };

    // Read a single oct texel (no filtering) for probe pi at integer texel
    // (tx, ty) ∈ [0..7]^2. The texture x-coord = pi * 8 + tx + 0.5.
    const fetchOctTexel = (pi, tx, ty) => {
      const u = pi.mul(OCT_F).add(tx).add(0.5).div(TEX_W);
      const v = ty.add(0.5).div(TEX_H);
      return uOctTex.sample(vec2(u, v)).rgb;
    };

    // Bilinear-blend 4 texels within a single probe's tile. We do it
    // manually so the blend never crosses into a neighbouring probe's tile
    // (which would happen with a hardware linear filter at the seam).
    const sampleProbeOct = (pi, n) => {
      const uv  = octEncode(n).mul(OCT_F).sub(0.5);
      const x0  = uv.x.floor().clamp(0.0, OCT_RES - 1);
      const y0  = uv.y.floor().clamp(0.0, OCT_RES - 1);
      const x1  = x0.add(1.0).min(float(OCT_RES - 1));
      const y1  = y0.add(1.0).min(float(OCT_RES - 1));
      const fx  = uv.x.sub(x0).clamp(0.0, 1.0);
      const fy  = uv.y.sub(y0).clamp(0.0, 1.0);
      const c00 = fetchOctTexel(pi, x0, y0);
      const c10 = fetchOctTexel(pi, x1, y0);
      const c01 = fetchOctTexel(pi, x0, y1);
      const c11 = fetchOctTexel(pi, x1, y1);
      const cx0 = c00.mix(c10, fx);
      const cx1 = c01.mix(c11, fx);
      return cx0.mix(cx1, fy);
    };

    const giSampleFn = Fn(([wp, n]) => {
      const grid = wp.sub(uProbeMin).div(uProbeMax.sub(uProbeMin))
                   .clamp(vec3(0.0), vec3(1.0))
                   .mul(uProbeDims.sub(vec3(1.0)));
      const baseIdx = grid.min(uProbeDims.sub(vec3(1.0001))).floor();
      const fracIdx = grid.sub(baseIdx).clamp(vec3(0.0), vec3(1.0));
      const probeSpacing = uProbeMax.sub(uProbeMin).div(uProbeDims.sub(vec3(1.0)));
      const Dx   = uProbeDims.x;
      const DxDy = uProbeDims.x.mul(uProbeDims.y);
      const wpBiased = wp.add(n.mul(uDepthBias));
      let sum = vec3(0.0).toVar();
      let wSum = float(0.0).toVar();
      for (let cz = 0; cz < 2; cz++) for (let cy = 0; cy < 2; cy++) for (let cx = 0; cx < 2; cx++) {
        const ix = baseIdx.x.add(float(cx));
        const iy = baseIdx.y.add(float(cy));
        const iz = baseIdx.z.add(float(cz));
        const tx = cx === 0 ? float(1.0).sub(fracIdx.x) : fracIdx.x;
        const ty = cy === 0 ? float(1.0).sub(fracIdx.y) : fracIdx.y;
        const tz = cz === 0 ? float(1.0).sub(fracIdx.z) : fracIdx.z;
        const sx = tx.mul(tx).mul(float(3.0).sub(tx.mul(2.0)));
        const sy = ty.mul(ty).mul(float(3.0).sub(ty.mul(2.0)));
        const sz = tz.mul(tz).mul(float(3.0).sub(tz.mul(2.0)));
        const triWeight = sx.mul(sy).mul(sz);
        const flatF = iz.mul(DxDy).add(iy.mul(Dx)).add(ix);
        const piInt = int(flatF);
        const pi    = float(flatF);
        const idxV       = vec3(ix, iy, iz);
        const probeWorld = uProbeMin.add(idxV.mul(probeSpacing));
        const dist       = wpBiased.sub(probeWorld).length();
        const dMean      = uDepthMean.element(piInt);
        const dMeanSq    = uDepthMeanSq.element(piInt);
        const variance   = dMeanSq.sub(dMean.mul(dMean)).max(float(1e-4));
        const distExcess = dist.sub(dMean).max(float(0.0));
        const chebyshevRaw = variance.div(variance.add(distExcess.mul(distExcess))).clamp(0.0, 1.0);
        const chebyshev    = chebyshevRaw.mul(chebyshevRaw);
        const visWeight  = uChebyshevFloor.mix(chebyshev, uChebyshevEnabled).max(uChebyshevFloor);
        const trappedFlag = uProbeTrapped.element(piInt);
        const aliveMask   = float(1.0).sub(trappedFlag);
        const weight     = triWeight.mul(visWeight).max(float(1e-5)).mul(aliveMask);
        const irr = sampleProbeOct(pi, n).max(vec3(0.0));
        sum  = sum.add(irr.mul(weight));
        wSum = wSum.add(weight);
      }
      return sum.div(wSum.max(float(1e-4)));
    });

    for (const m of [matWhite, matRed, matGreen, matBox]) {
      const N = normalWorld.normalize();
      const giRaw = giSampleFn(positionWorld, N);
      const giIrradiance = giRaw.max(vec3(0.0));
      m.ddgiIrradianceNode = giIrradiance.mul(uGiEnabled).mul(uGiIntensity);
    }
    bc('TSL GI graph built (RT path)');
  } catch (e) {
    bc('TSL graph FAILED: ' + e.message);
    console.error(e);
  }

  // ---------- Bake orchestration ----------
  // One bake = run RT compute, run integrate compute, copy SH+depth back to
  // CPU, push into the uniformArrays that feed the fragment shader. Multiple
  // bounces = repeat: each pass reads the *previous* SH from probeSHBuf as
  // the indirect cache, and overwrites it with the new SH.

  let bakeInFlight = false;
  let bakeRequested = false;
  let frameSeed = 0;
  const stats = new Stats();

  async function bakeOnce(indirectScale) {
    frameSeed = (frameSeed + 1) & 0xffff;
    packRTUniforms(frameSeed, indirectScale);
    writeIntegrateUniforms(frameSeed);

    const enc = device.createCommandEncoder({ label: 'ddgi-bake' });
    {
      const pass = enc.beginComputePass({ label: 'rt-pass' });
      pass.setPipeline(rtPipeline);
      pass.setBindGroup(0, rtBindGroup);
      pass.dispatchWorkgroups(Math.ceil(TOTAL_RAYS / 64));
      pass.end();
    }
    {
      const pass = enc.beginComputePass({ label: 'integrate-pass' });
      pass.setPipeline(intPipeline);
      pass.setBindGroup(0, intBindGroup);
      pass.dispatchWorkgroups(Math.ceil(PROBE_COUNT / 64));
      pass.end();
    }
    {
      // Seed-pass: trapped probes get DC ambient from their 6 axis-neighbours
      // so they contribute pure ambient instead of zero (which would create
      // dark pockets if Chebyshev visibility ever fails on a fragment query).
      const pass = enc.beginComputePass({ label: 'seed-pass' });
      pass.setPipeline(seedPipeline);
      pass.setBindGroup(0, seedBindGroup);
      pass.dispatchWorkgroups(Math.ceil(PROBE_COUNT / 64));
      pass.end();
    }
    enc.copyBufferToBuffer(probeOctBuf, 0, probeOctReadBuf, 0, probeOctBufBytes);
    enc.copyBufferToBuffer(probeDepthBuf, 0, probeDepthReadBuf, 0, PROBE_COUNT * 16);
    // Debug: copy every probe's rays into the staging buffer for full-scene
    // ray visualization.
    enc.copyBufferToBuffer(rayHitsBuf, 0, debugRayReadBuf, 0, TOTAL_RAYS * 16);
    device.queue.submit([enc.finish()]);

    await Promise.all([
      probeOctReadBuf.mapAsync(GPUMapMode.READ),
      probeDepthReadBuf.mapAsync(GPUMapMode.READ),
      debugRayReadBuf.mapAsync(GPUMapMode.READ),
    ]);
    const octView = new Float32Array(probeOctReadBuf.getMappedRange());
    const dView  = new Float32Array(probeDepthReadBuf.getMappedRange());
    for (let p = 0; p < PROBE_COUNT; p++) {
      const probeSrc = p * OCT_TEXELS * 4;
      const probeDstX = p * OCT_RES;
      for (let ty = 0; ty < OCT_RES; ty++) {
        const srcOff = probeSrc + ty * OCT_RES * 4;
        const dstOff = (ty * OCT_TEX_W + probeDstX) * 4;
        probeOctData.set(octView.subarray(srcOff, srcOff + OCT_RES * 4), dstOff);
      }
      probeDepthMeanArr[p]   = dView[p * 4 + 0];
      probeDepthMeanSqArr[p] = dView[p * 4 + 1];
      const trapped = dView[p * 4 + 3] > 0.5;
      probeTrappedFlags[p]   = trapped;
      if (probeTrappedFloatArr) probeTrappedFloatArr[p] = trapped ? 1.0 : 0.0;
    }
    probeOctTex.needsUpdate = true;
    // Debug: pull every probe's rays and rebuild the line visualization.
    const rayView = new Float32Array(debugRayReadBuf.getMappedRange());
    const debugRays = new Float32Array(rayView); // copy out before unmap
    debugRayReadBuf.unmap();
    probeOctReadBuf.unmap();
    probeDepthReadBuf.unmap();
    stats.totalProbeUpdates += PROBE_COUNT;
    updateDebugProbeColors();
    updateDebugRayLines(debugRays, frameSeed);
    relocateProbes(debugRays, frameSeed);
  }

  // Probe relocation: nudge each probe away from nearby geometry by averaging
  // the directions of rays that hit *backfaces* (meaning the probe is buried
  // in or grazing a wall in those directions). Push opposite to that average
  // by a small step, clamp drift to half the cell spacing, then re-upload the
  // position buffer so the next RT pass traces from the new positions. Over
  // a handful of bakes, trapped probes converge to free space — same idea as
  // the relocation step in the original DDGI paper.
  const _relocTmp = new THREE.Vector3();
  function relocateProbes(rayData, frameSeed) {
    const stepBuf = probePosBuf32; // we reuse the existing GPU upload buffer
    let movedAny = false;
    for (let p = 0; p < PROBE_COUNT; p++) {
      const probeRayBase = p * RAYS_PER_PROBE * 4;
      const seed = frameSeed + p * 0.61803;
      let pushX = 0, pushY = 0, pushZ = 0;
      let weightSum = 0;
      for (let i = 0; i < RAYS_PER_PROBE; i++) {
        const signedDist = rayData[probeRayBase + i * 4 + 3];
        // RT pass encodes backface as negative signed distance.
        if (signedDist >= 0) continue;
        const hitDist = -signedDist;
        const dir = fibSphereJS(i, RAYS_PER_PROBE, seed);
        // Closer backfaces push harder (1/dist falls off, capped). All
        // backfaces contribute — a probe on a cube face has a long backface
        // ray across the cube interior, which still indicates the probe is
        // wrong-side of that wall and should drift away from that direction.
        const w = 1.0 / Math.max(hitDist, 0.05);
        pushX -= dir[0] * w; // away from the backface direction
        pushY -= dir[1] * w;
        pushZ -= dir[2] * w;
        weightSum += w;
      }
      if (weightSum < 1e-3) continue;
      // Normalise the average and step a fraction of probe spacing.
      const invW = 1.0 / weightSum;
      pushX *= invW; pushY *= invW; pushZ *= invW;
      const len = Math.sqrt(pushX*pushX + pushY*pushY + pushZ*pushZ);
      if (len < 1e-3) continue;
      const stepLen = MAX_PROBE_OFFSET * RELOCATION_STEP;
      const nx = pushX / len * stepLen;
      const ny = pushY / len * stepLen;
      const nz = pushZ / len * stepLen;
      const off = probeOffsets[p];
      _relocTmp.set(off.x + nx, off.y + ny, off.z + nz);
      // Clamp the cumulative offset to a sphere of radius MAX_PROBE_OFFSET.
      const offLen = _relocTmp.length();
      if (offLen > MAX_PROBE_OFFSET) _relocTmp.multiplyScalar(MAX_PROBE_OFFSET / offLen);
      off.copy(_relocTmp);
      // Apply: physical = home + offset.
      const home = probeHomePositions[p];
      probePositions[p].set(home.x + off.x, home.y + off.y, home.z + off.z);
      stepBuf[p * 4 + 0] = probePositions[p].x;
      stepBuf[p * 4 + 1] = probePositions[p].y;
      stepBuf[p * 4 + 2] = probePositions[p].z;
      // Move the debug sphere too so probe visualization reflects the drift.
      if (debugSpheres[p]) debugSpheres[p].position.copy(probePositions[p]);
      movedAny = true;
    }
    if (movedAny) device.queue.writeBuffer(probePosBuf, 0, stepBuf);
  }

  // Mirror of WGSL fibSphere — must produce identical directions per ray.
  function fibSphereJS(rayI, total, seed) {
    const golden = 0.5 * (Math.sqrt(5.0) - 1.0);
    const i = rayI + 0.5;
    const f = i * golden + seed * golden;
    const phi = 2.0 * Math.PI * (f - Math.floor(f));
    const cosTheta = 1.0 - 2.0 * (i / total);
    const sinTheta = Math.sqrt(Math.max(0.0, 1.0 - cosTheta * cosTheta));
    return [Math.cos(phi) * sinTheta, Math.sin(phi) * sinTheta, cosTheta];
  }

  // One LineSegments mesh covering rays from every probe. Each segment goes
  // from a probe origin out along its ray direction, length = clamped hit
  // distance. Colour = clamped radiance the ray captured.
  // PROBE_COUNT * RAYS_PER_PROBE segments = 2× that many vertices × 3 floats.
  const debugRayGeo = new THREE.BufferGeometry();
  const debugRayPositions = new Float32Array(TOTAL_RAYS * 2 * 3);
  const debugRayColors    = new Float32Array(TOTAL_RAYS * 2 * 3);
  debugRayGeo.setAttribute('position', new THREE.BufferAttribute(debugRayPositions, 3).setUsage(THREE.DynamicDrawUsage));
  debugRayGeo.setAttribute('color',    new THREE.BufferAttribute(debugRayColors, 3).setUsage(THREE.DynamicDrawUsage));
  const debugRayMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.35, depthTest: false });
  const debugRayLines = new THREE.LineSegments(debugRayGeo, debugRayMat);
  debugRayLines.frustumCulled = false;
  debugRayLines.renderOrder = 999;
  debugRayLines.visible = false; // toggle via "Show ray debug" in the GUI
  scene.add(debugRayLines);

  function updateDebugRayLines(rayData, frameSeed) {
    if (!debugRayLines.visible) return; // skip the heavy CPU work when hidden
    const posAttr = debugRayGeo.attributes.position;
    const colAttr = debugRayGeo.attributes.color;
    const pos = posAttr.array;
    const col = colAttr.array;
    for (let p = 0; p < PROBE_COUNT; p++) {
      const probe = probePositions[p];
      // Seed must match RT pass exactly: U.rtMeta.z + probeIdx * 0.61803.
      const seed = frameSeed + p * 0.61803;
      const probeRayBase = p * RAYS_PER_PROBE * 4;
      const segBase = p * RAYS_PER_PROBE * 6;
      for (let i = 0; i < RAYS_PER_PROBE; i++) {
        const dir = fibSphereJS(i, RAYS_PER_PROBE, seed);
        const r = rayData[probeRayBase + i * 4 + 0];
        const g = rayData[probeRayBase + i * 4 + 1];
        const b = rayData[probeRayBase + i * 4 + 2];
        const signedDist = rayData[probeRayBase + i * 4 + 3];
        // RT pass writes hitDist=50.0 for miss rays; collapse those to a
        // zero-length segment so they don't draw as a uniform 2.0-length
        // black streak across the visualization.
        const absDist = Math.abs(signedDist);
        const isMiss  = absDist >= 49.0;
        const dist    = isMiss ? 0.0 : Math.min(absDist, 4.0);
        const o = segBase + i * 6;
        pos[o + 0] = probe.x;
        pos[o + 1] = probe.y;
        pos[o + 2] = probe.z;
        pos[o + 3] = probe.x + dir[0] * dist;
        pos[o + 4] = probe.y + dir[1] * dist;
        pos[o + 5] = probe.z + dir[2] * dist;
        const cr = Math.min(1.0, r);
        const cg = Math.min(1.0, g);
        const cb = Math.min(1.0, b);
        col[o + 0] = cr; col[o + 1] = cg; col[o + 2] = cb;
        col[o + 3] = cr; col[o + 4] = cg; col[o + 5] = cb;
      }
    }
    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
  }

  async function bakeAllProbes(bounces = 2) {
    if (bakeInFlight) { bakeRequested = true; return; }
    bakeInFlight = true;
    try {
      do {
        bakeRequested = false;
        // First bounce reads zero SH; second+ reads the previous bounce. The
        // indirect scale starts at 0 (so the first bake captures pure direct
        // light) and ramps to 1 on subsequent bakes.
        for (let b = 0; b < bounces; b++) {
          await bakeOnce(b === 0 ? 0.0 : 1.0);
          bc(`RT bake bounce ${b + 1}/${bounces}`);
        }
      } while (bakeRequested);
    } finally {
      bakeInFlight = false;
    }
  }

  let rebakeTimer = 0;
  function scheduleRebake() {
    if (rebakeTimer) window.clearTimeout(rebakeTimer);
    rebakeTimer = window.setTimeout(() => { rebakeTimer = 0; bakeAllProbes(params.bounces); }, 200);
  }

  // ---------- GUI ----------
  const params = {
    giEnabled: true,
    giIntensity: 2.0,
    chebyshevEnabled: true,
    depthBias: 0.12,
    chebyshevFloor: 0.0,
    keyIntensity: keyLight.intensity,
    keyColor: '#' + keyLight.color.getHexString(),
    keyHeight: keyLight.position.y,
    panelR: uPanelColor.value.x, panelG: uPanelColor.value.y, panelB: uPanelColor.value.z,
    wallRed:   '#' + matRed.color.getHexString(),
    wallGreen: '#' + matGreen.color.getHexString(),
    wallWhite: '#' + matWhite.color.getHexString(),
    bounces: 4,
    showProbes: false,
    showDebugRays: false,
    rebake: () => bakeAllProbes(params.bounces),
  };
  const gui = new GUI({ title: 'DDGI · WebGPU raytraced', width: 320 });

  const fGI = gui.addFolder('GI');
  fGI.add(params, 'giEnabled').name('GI enabled').onChange(v => uGiEnabled.value = v ? 1 : 0);
  fGI.add(params, 'giIntensity', 0, 3, 0.05).name('GI intensity').onChange(v => uGiIntensity.value = v);
  fGI.add(params, 'chebyshevEnabled').name('Chebyshev visibility').onChange(v => {
    uChebyshevEnabled.value = v ? 1 : 0;
    if (v) scheduleRebake();
  });
  fGI.add(params, 'depthBias', 0, 0.5, 0.005).name('Depth bias').onChange(v => uDepthBias.value = v);
  fGI.add(params, 'chebyshevFloor', 0, 1, 0.01).name('Cheby floor').onChange(v => uChebyshevFloor.value = v);
  fGI.add(params, 'bounces', 1, 4, 1).name('Bounces / bake');
  fGI.add(params, 'rebake').name('Rebake GI');

  const fLight = gui.addFolder('Light');
  fLight.add(params, 'keyIntensity', 0, 20, 0.05).name('Key intensity').onChange(v => { keyLight.intensity = v; scheduleRebake(); });
  fLight.addColor(params, 'keyColor').name('Key color').onChange(v => { keyLight.color.set(v); scheduleRebake(); });
  fLight.add(params, 'keyHeight', 0.1, 2*BOX.y - 0.05, 0.01).name('Key height').onChange(v => { keyLight.position.y = v; scheduleRebake(); });
  const setPanelAndRebake = () => { uPanelColor.value.set(params.panelR, params.panelG, params.panelB); scheduleRebake(); };
  fLight.add(params, 'panelR', 0, 20, 0.05).name('Panel R').onChange(setPanelAndRebake);
  fLight.add(params, 'panelG', 0, 20, 0.05).name('Panel G').onChange(setPanelAndRebake);
  fLight.add(params, 'panelB', 0, 20, 0.05).name('Panel B').onChange(setPanelAndRebake);

  const fWalls = gui.addFolder('Walls');
  fWalls.addColor(params, 'wallRed').name('Red wall').onChange(v => { matRed.color.set(v); scheduleRebake(); });
  fWalls.addColor(params, 'wallGreen').name('Green wall').onChange(v => { matGreen.color.set(v); scheduleRebake(); });
  fWalls.addColor(params, 'wallWhite').name('White walls').onChange(v => { matWhite.color.set(v); scheduleRebake(); });

  const fView = gui.addFolder('View');
  fView.add(params, 'showProbes').name('Show probes').onChange(v => debugProbeGroup.visible = v);
  // Toggling rays on triggers a rebake so updateDebugRayLines runs against
  // fresh ray data (it bails when hidden to avoid the per-frame CPU cost).
  fView.add(params, 'showDebugRays').name('Show ray debug').onChange(v => {
    debugRayLines.visible = v;
    if (v) scheduleRebake();
  });

  // ---------- Initial bake + render loop ----------
  // Hide the canvas until the first bake settles so the user never sees the
  // black-no-GI intermediate state. The status overlay (managed by loadScene)
  // remains on top showing the bake progress breadcrumbs.
  canvas.style.visibility = 'hidden';
  bc('initial RT bake (4 bounces)…');
  await bakeAllProbes(params.bounces);
  bc('initial bake done');

  const clock = new THREE.Clock();
  let rafId, stopped = false, firstFrame = true;
  async function tick() {
    if (stopped) return;
    const dt = clock.getDelta();
    controls.update();
    try {
      await renderer.renderAsync(scene, camera);
      if (firstFrame) {
        firstFrame = false;
        bc('first renderAsync OK');
        canvas.style.visibility = 'visible';
      }
    } catch (e) {
      stopped = true;
      console.error(e);
      statusEl.classList.add('show');
      statusEl.innerHTML = `<span class="err"><b>Render failed</b><br>${e.message || e}</span>`;
      return;
    }
    stats.tick(dt);
    if (!stopped) rafId = requestAnimationFrame(tick);
  }
  bc('starting render loop');
  tick();

  const onResize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', onResize);

  bc('createWebGPURTScene done');
  return {
    dispose() {
      stopped = true;
      cancelAnimationFrame(rafId);
      if (rebakeTimer) window.clearTimeout(rebakeTimer);
      window.removeEventListener('resize', onResize);
      gui.destroy();
      controls.dispose();
      [bvhNodeBuf, bvhIdxBuf, triBuf, triMatBuf, probePosBuf, rayHitsBuf,
       probeOctBuf, probeDepthBuf, probeOctReadBuf, probeDepthReadBuf,
       rtUniBuf, intUniBuf, seedUniBuf].forEach(b => { try { b.destroy(); } catch (e) { /* ok */ } });
      scene.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          ms.forEach(m => m.dispose());
        }
      });
      renderer.dispose();
    }
  };
}

// ============================================================
// WebGL scene — original implementation with onBeforeCompile patches
// ============================================================
async function createWebGLScene(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  RectAreaLightUniformsLib.init();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 100);
  camera.position.set(0, 1.0, 3.6);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.0, 0);
  controls.enableDamping = true;
  controls.minDistance = 1.2;
  controls.maxDistance = 8;

  // ---- Cornell Box ----
  const cornell = new THREE.Group();
  scene.add(cornell);

  const wallMat = (color) => new THREE.MeshStandardMaterial({ color, roughness: 1.0, metalness: 0.0 });
  const matWhite = wallMat(0xeeeeee);
  const matRed   = wallMat(0xcc2828);
  const matGreen = wallMat(0x28a828);

  const makeQuad = (w,h,m) => new THREE.Mesh(new THREE.PlaneGeometry(w,h), m);
  { const m = makeQuad(2*BOX.x, 2*BOX.z, matWhite); m.rotation.x = -Math.PI/2; cornell.add(m); }
  { const m = makeQuad(2*BOX.x, 2*BOX.z, matWhite); m.rotation.x =  Math.PI/2; m.position.y = 2*BOX.y; cornell.add(m); }
  { const m = makeQuad(2*BOX.x, 2*BOX.y, matWhite); m.position.set(0, BOX.y, -BOX.z); cornell.add(m); }
  { const m = makeQuad(2*BOX.z, 2*BOX.y, matRed);   m.rotation.y =  Math.PI/2; m.position.set(-BOX.x, BOX.y, 0); cornell.add(m); }
  { const m = makeQuad(2*BOX.z, 2*BOX.y, matGreen); m.rotation.y = -Math.PI/2; m.position.set( BOX.x, BOX.y, 0); cornell.add(m); }

  const lightPanel = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.45),
    new THREE.MeshBasicMaterial({ color: 0xffffff }));
  lightPanel.material.color.setRGB(8, 8, 7);
  lightPanel.rotation.x = Math.PI/2;
  lightPanel.position.set(0, 2*BOX.y - 0.001, 0);
  cornell.add(lightPanel);

  const rectLight = new THREE.RectAreaLight(0xffffff, 18, 0.55, 0.45);
  rectLight.position.set(0, 2*BOX.y - 0.005, 0);
  rectLight.lookAt(0, 0, 0);
  scene.add(rectLight);

  const BOX_SEGMENTS = 28;
  const boxWireframes = [];
  const addBoxWireframe = (mesh) => {
    const wire = new THREE.LineSegments(
      new THREE.WireframeGeometry(mesh.geometry),
      new THREE.LineBasicMaterial({
        color: 0x111111,
        transparent: true,
        opacity: 0.42,
        depthWrite: false
      })
    );
    wire.scale.setScalar(1.003);
    wire.visible = false;
    wire.renderOrder = 2;
    boxWireframes.push(wire);
    mesh.add(wire);
  };

  const tallBox = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.1, 0.55, BOX_SEGMENTS, BOX_SEGMENTS * 2, BOX_SEGMENTS), matWhite);
  tallBox.position.set(-0.3, 0.55, -0.3);
  tallBox.rotation.y = THREE.MathUtils.degToRad(18);
  addBoxWireframe(tallBox);
  cornell.add(tallBox);

  const shortBox = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55, BOX_SEGMENTS, BOX_SEGMENTS, BOX_SEGMENTS), matWhite);
  shortBox.position.set(0.32, 0.275, 0.28);
  shortBox.rotation.y = THREE.MathUtils.degToRad(-18);
  addBoxWireframe(shortBox);
  cornell.add(shortBox);

  const moverMat = new THREE.MeshStandardMaterial({
    color: 0xff8a00, emissive: 0xff8a00, emissiveIntensity: 0.6,
    roughness: 0.4, metalness: 0.0
  });
  const mover = new THREE.Mesh(new THREE.SphereGeometry(0.13, 32, 24), moverMat);
  mover.position.set(0, 1.0, 0.4);
  cornell.add(mover);

  // ---- Probes ----
  const probes = [];
  const probePositions = [];
  const probeRTs = [];
  const cubeCameras = [];
  for (let z=0; z<PROBE_DIMS.z; z++) for (let y=0; y<PROBE_DIMS.y; y++) for (let x=0; x<PROBE_DIMS.x; x++) {
    const p = new THREE.Vector3(
      THREE.MathUtils.lerp(PROBE_MIN.x, PROBE_MAX.x, x/(PROBE_DIMS.x-1)),
      THREE.MathUtils.lerp(PROBE_MIN.y, PROBE_MAX.y, y/(PROBE_DIMS.y-1)),
      THREE.MathUtils.lerp(PROBE_MIN.z, PROBE_MAX.z, z/(PROBE_DIMS.z-1))
    );
    probePositions.push(p);
    const rt = new THREE.WebGLCubeRenderTarget(16, {
      format: THREE.RGBAFormat, type: THREE.HalfFloatType,
      generateMipmaps: false, colorSpace: THREE.LinearSRGBColorSpace
    });
    probeRTs.push(rt);
    const cam = new THREE.CubeCamera(0.01, 20, rt);
    cam.position.copy(p);
    scene.add(cam);
    cubeCameras.push(cam);
    // Store SH as raw Vector3[9] — no LightProbe wrapper to avoid version churn
    const probeSH = [];
    for (let k=0; k<9; k++) probeSH.push(new THREE.Vector3());
    probes.push(probeSH);
  }

  // debug spheres
  const debugProbeGroup = new THREE.Group();
  debugProbeGroup.visible = false;
  scene.add(debugProbeGroup);
  const debugSpheres = [];
  for (let i=0; i<PROBE_COUNT; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0x222222 }));
    m.position.copy(probePositions[i]);
    debugProbeGroup.add(m);
    debugSpheres.push(m);
  }

  // SH coefficient buffer
  const SH_COEFFS = 9;
  const probeSHBuffer = new Array(PROBE_COUNT * SH_COEFFS);
  for (let i=0; i<probeSHBuffer.length; i++) probeSHBuffer[i] = new THREE.Vector3();

  function uploadProbeSH(i) {
    const sh = probes[i]; // Vector3[9]
    const base = i * SH_COEFFS;
    for (let k=0; k<9; k++) probeSHBuffer[base+k].copy(sh[k]);
    const c = debugSpheres[i].material.color;
    const sc = 1.0/3.5449;
    c.setRGB(
      Math.max(0, Math.min(1, sh[0].x * sc)),
      Math.max(0, Math.min(1, sh[0].y * sc)),
      Math.max(0, Math.min(1, sh[0].z * sc))
    );
  }

  // GI uniforms (shared across all patched materials)
  const giUniforms = {
    uProbeSH:     { value: probeSHBuffer },
    uProbeMin:    { value: PROBE_MIN.clone() },
    uProbeMax:    { value: PROBE_MAX.clone() },
    uProbeDims:   { value: PROBE_DIMS.clone() },
    uGiIntensity: { value: 1.0 },
    uGiEnabled:   { value: 1.0 },
  };

  const giVertexInject = `
varying vec3 vGiWorldPos;
varying vec3 vGiWorldNormal;
`;
  const giVertexEnd = `
vGiWorldPos    = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;
vGiWorldNormal = normalize( ( modelMatrix * vec4( objectNormal, 0.0 ) ).xyz );
`;
  const giFragmentInject = `
#define DDGI_PROBE_SH_COUNT ${PROBE_COUNT * 9}
#define DDGI_PROBE_COUNT ${PROBE_COUNT}
#define DDGI_PROBE_X ${PROBE_DIMS.x}
#define DDGI_PROBE_Y ${PROBE_DIMS.y}
#define DDGI_PROBE_Z ${PROBE_DIMS.z}
uniform vec3  uProbeSH[ DDGI_PROBE_SH_COUNT ];
uniform vec3  uProbeMin;
uniform vec3  uProbeMax;
uniform vec3  uProbeDims;
uniform float uGiIntensity;
uniform float uGiEnabled;
varying vec3  vGiWorldPos;
varying vec3  vGiWorldNormal;

vec3 ddgi_shIrradiance( vec3 n, int b ) {
    float x = n.x, y = n.y, z = n.z;
    vec3 r  = uProbeSH[ b + 0 ] * 0.886227;
    r += uProbeSH[ b + 1 ] * 2.0 * 0.511664 * y;
    r += uProbeSH[ b + 2 ] * 2.0 * 0.511664 * z;
    r += uProbeSH[ b + 3 ] * 2.0 * 0.511664 * x;
    r += uProbeSH[ b + 4 ] * 2.0 * 0.429043 * x * y;
    r += uProbeSH[ b + 5 ] * 2.0 * 0.429043 * y * z;
    r += uProbeSH[ b + 6 ] * ( 0.743125 * z * z - 0.247708 );
    r += uProbeSH[ b + 7 ] * 2.0 * 0.429043 * x * z;
    r += uProbeSH[ b + 8 ] * 0.429043 * ( x * x - y * y );
    return r;
}
vec3 ddgi_sampleGrid( vec3 wp, vec3 n ) {
    vec3 grid = ( wp - uProbeMin ) / ( uProbeMax - uProbeMin );
    grid = clamp( grid, vec3(0.0), vec3(1.0) ) * ( uProbeDims - vec3(1.0) );
    const float kernelRadius = 2.35;
    vec3 sum = vec3(0.0); float wSum = 0.0;
    int pi = 0;
    for ( int iz = 0; iz < DDGI_PROBE_Z; iz++ ) {
    for ( int iy = 0; iy < DDGI_PROBE_Y; iy++ ) {
    for ( int ix = 0; ix < DDGI_PROBE_X; ix++ ) {
        vec3 idx = vec3( float(ix), float(iy), float(iz) );
        vec3 d = grid - idx;
        float q = clamp( dot( d, d ) / ( kernelRadius * kernelRadius ), 0.0, 1.0 );
        float kernel = 1.0 - q;
        float weight = kernel * kernel * ( 3.0 - 2.0 * kernel );
        sum  += weight * ddgi_shIrradiance( n, pi * 9 );
        wSum += weight;
        pi++;
    }
    }
    }
    return sum / max( wSum, 1e-4 );
}
`;
  function patchStandardMaterial(material) {
    material.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, giUniforms);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\n' + giVertexInject)
        .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n' + giVertexEnd);
      if (!shader.vertexShader.includes('vGiWorldPos    =')) {
        shader.vertexShader = shader.vertexShader.replace(
          '#include <project_vertex>',
          giVertexEnd + '\n#include <project_vertex>'
        );
      }
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\n' + giFragmentInject)
        .replace('#include <lights_fragment_maps>', `
          #include <lights_fragment_maps>
          {
            vec3 nGi = normalize( vGiWorldNormal );
            vec3 gi = ddgi_sampleGrid( vGiWorldPos, nGi );
            iblIrradiance += uGiEnabled * uGiIntensity * max( gi, vec3(0.0) );
          }
        `);
    };
    material.needsUpdate = true;
  }
  [matWhite, matRed, matGreen, moverMat].forEach(m => patchStandardMaterial(m));

  // ---- Manual SH integration (bypasses LightProbeGenerator API churn) ----
  const FACE_SIZE = 16;
  const COS_BAND = [Math.PI, 2*Math.PI/3, 2*Math.PI/3, 2*Math.PI/3,
                    Math.PI/4, Math.PI/4, Math.PI/4, Math.PI/4, Math.PI/4];
  const FACE_DIRS = [];
  function f16ToF32(h) {
    const s = (h & 0x8000) >> 15, e = (h & 0x7C00) >> 10, f = h & 0x03FF;
    if (e === 0) return (s ? -1 : 1) * Math.pow(2, -14) * (f / 1024);
    if (e === 0x1F) return f ? NaN : ((s ? -1 : 1) * Infinity);
    return (s ? -1 : 1) * Math.pow(2, e - 15) * (1 + f / 1024);
  }
  function shBasis(d) {
    const x=d.x, y=d.y, z=d.z;
      return [0.282095, 0.488603*y, 0.488603*z, 0.488603*x,
        1.092548*x*y, 1.092548*y*z, 0.315392*(3*z*z-1),
        1.092548*x*z, 0.546274*(x*x-y*y)];
  }
  for (let f=0; f<6; f++) {
    const arr = [];
    for (let v=0; v<FACE_SIZE; v++) for (let u=0; u<FACE_SIZE; u++) {
      const fu = (u + 0.5) / FACE_SIZE * 2 - 1;
      const fv = (v + 0.5) / FACE_SIZE * 2 - 1;
      let x,y,z;
      switch(f) {
        case 0: x = 1; y =-fv; z =-fu; break;
        case 1: x =-1; y =-fv; z = fu; break;
        case 2: x = fu; y = 1; z = fv; break;
        case 3: x = fu; y =-1; z =-fv; break;
        case 4: x = fu; y =-fv; z = 1; break;
        case 5: x =-fu; y =-fv; z =-1; break;
      }
      const len = Math.sqrt(x*x+y*y+z*z);
      arr.push({ x: x/len, y: y/len, z: z/len, w: 4 / ((1 + fu*fu + fv*fv) * len) });
    }
    FACE_DIRS.push(arr);
  }

  // probe capture
  let nextProbeToUpdate = 0;
  let probeUpdateInFlight = false;
  let stopped = false;
  const stats = new Stats();
  const _shTmp = [];
  for (let i=0; i<9; i++) _shTmp.push({x:0,y:0,z:0});

  async function integrateRadianceSH(rt) {
    for (let k=0; k<9; k++) { _shTmp[k].x = 0; _shTmp[k].y = 0; _shTmp[k].z = 0; }
    for (let f=0; f<6; f++) {
      if (stopped) return null;
      const buf = new Uint16Array(FACE_SIZE * FACE_SIZE * 4);
      // r172 WebGL signature: readRenderTargetPixels(rt, x, y, w, h, buffer, activeCubeFaceIndex)
      await renderer.readRenderTargetPixelsAsync(rt, 0, 0, FACE_SIZE, FACE_SIZE, buf, f);
      if (stopped) return null;
      const dirs = FACE_DIRS[f];
      for (let i=0; i<FACE_SIZE*FACE_SIZE; i++) {
        const r = f16ToF32(buf[i*4+0]);
        const g = f16ToF32(buf[i*4+1]);
        const b = f16ToF32(buf[i*4+2]);
        const d = dirs[i];
        const basis = shBasis(d);
        for (let k=0; k<9; k++) {
          const w = basis[k] * d.w;
          _shTmp[k].x += r * w;
          _shTmp[k].y += g * w;
          _shTmp[k].z += b * w;
        }
      }
    }
    // cosine convolution (Lambertian irradiance)
    const out = [];
    for (let k=0; k<9; k++) out.push({
      x: _shTmp[k].x * COS_BAND[k],
      y: _shTmp[k].y * COS_BAND[k],
      z: _shTmp[k].z * COS_BAND[k],
    });
    return out;
  }

  async function updateProbes(count) {
    if (probeUpdateInFlight || stopped) return;
    probeUpdateInFlight = true;
    try {
      const wasDebug = debugProbeGroup.visible;
      debugProbeGroup.visible = false;
      const oldTM = renderer.toneMapping;
      renderer.toneMapping = THREE.NoToneMapping;
      for (let i=0; i<count; i++) {
        if (stopped) break;
        const idx = nextProbeToUpdate;
        const cam = cubeCameras[idx];
        cam.position.copy(probePositions[idx]);
        cam.update(renderer, scene);
        try {
          const sh = await integrateRadianceSH(probeRTs[idx]);
          if (stopped || !sh) break;
          // store SH directly into Vector3[] for this probe
          for (let k=0; k<9; k++) probes[idx][k].set(sh[k].x, sh[k].y, sh[k].z);
          uploadProbeSH(idx);
        } catch (e) {
          console.warn(`Probe ${idx} integration failed:`, e.message);
        }
        nextProbeToUpdate = (nextProbeToUpdate + 1) % PROBE_COUNT;
        stats.totalProbeUpdates++;
      }
      if (!stopped) {
        renderer.toneMapping = oldTM;
        debugProbeGroup.visible = wasDebug;
      }
    } finally {
      probeUpdateInFlight = false;
    }
  }
  // priming pass (one full sweep — multi-bounce accumulates passively)
  setStatus('Capturing probes…');
  await updateProbes(PROBE_COUNT);
  setStatus('');

  // GUI
  const params = {
    giEnabled: true, giIntensity: 1.0, showProbes: false, boxWireframe: false,
    probesPerFrame: 4, moverActive: true, exposure: 1.0,
  };
  const gui = new GUI({ title: 'DDGI · WebGL', width: 280 });
  gui.add(params, 'giEnabled').name('GI enabled').onChange(v => giUniforms.uGiEnabled.value = v ? 1 : 0);
  gui.add(params, 'giIntensity', 0, 3, 0.05).name('GI intensity').onChange(v => giUniforms.uGiIntensity.value = v);
  gui.add(params, 'showProbes').name('Show probes').onChange(v => debugProbeGroup.visible = v);
  gui.add(params, 'boxWireframe').name('Box wireframe').onChange(v => boxWireframes.forEach(w => w.visible = v));
  gui.add(params, 'probesPerFrame', 1, 16, 1).name('Probes / frame');
  gui.add(params, 'moverActive').name('Animate mover');
  gui.add(params, 'exposure', 0.2, 2.0, 0.05).name('Exposure').onChange(v => renderer.toneMappingExposure = v);
  gui.add({ rebuild: () => updateProbes(PROBE_COUNT) }, 'rebuild').name('Full probe refresh');

  const clock = new THREE.Clock();
  let rafId;
  function tick() {
    if (stopped) return;
    rafId = requestAnimationFrame(tick);
    const dt = clock.getDelta(), t = clock.elapsedTime;
    if (params.moverActive) {
      mover.position.set(
        Math.sin(t*0.7)*0.55,
        0.65 + 0.25*Math.sin(t*1.1),
        Math.cos(t*0.9)*0.55
      );
      const hue = (t*0.05) % 1.0;
      moverMat.color.setHSL(hue, 0.85, 0.55);
      moverMat.emissive.copy(moverMat.color);
    }
    // fire-and-forget — async, single-flight via probeUpdateInFlight
    updateProbes(params.probesPerFrame).catch(e => console.warn('probe update', e));
    controls.update();
    renderer.render(scene, camera);
    stats.tick(dt);
  }
  tick();

  const onResize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', onResize);

  return {
    async dispose() {
      stopped = true;
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', onResize);
      // Wait for any in-flight probe readback to bail out before disposing the
      // render targets it is reading from. Otherwise three.js's
      // readRenderTargetPixelsAsync trips on a missing __webglFramebuffer when
      // the cube RT is disposed mid-flight.
      while (probeUpdateInFlight) await new Promise(r => setTimeout(r, 0));
      gui.destroy();
      controls.dispose();
      probeRTs.forEach(rt => rt.dispose());
      scene.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          ms.forEach(m => m.dispose());
        }
      });
      renderer.dispose();
    }
  };
}

// ---------- entry point ----------
loadScene('webgl');

</script>
